<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Copa · Examen Anual</title>
<style>
  :root{
    --bg:#0b1f3a; --bg2:#10294d; --card:#ffffff; --ink:#12233d;
    --muted:#5d6f8a; --blue:#0f5fd0; --blue-d:#0a4aa5; --green:#16a34a;
    --red:#dc2626; --amber:#f59e0b; --line:#e5ebf3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2)); color:var(--ink); min-height:100vh;}
  #app{max-width:640px; margin:0 auto; padding:20px 16px 48px;}
  .hero{text-align:center; color:#fff; padding:26px 8px 18px;}
  .hero .plane{font-size:44px;}
  .hero h1{margin:10px 0 4px; font-size:26px; letter-spacing:.3px;}
  .hero p{margin:0; color:#b9c9e2; font-size:14px;}
  .card{background:var(--card); border-radius:18px; padding:20px; margin:14px 0;
    box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .card h2{margin:0 0 12px; font-size:17px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:2px solid var(--line); background:#f6f9fd; border-radius:999px;
    padding:9px 13px; font-size:13.5px; cursor:pointer; user-select:none; color:var(--ink);}
  .chip small{color:var(--muted); margin-left:4px;}
  .chip.on{border-color:var(--blue); background:#e8f1fe; color:var(--blue-d); font-weight:600;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .seg{flex:1 1 0; min-width:64px; text-align:center; border:2px solid var(--line); background:#f6f9fd;
    border-radius:12px; padding:11px 6px; font-size:14px; cursor:pointer;}
  .seg.on{border-color:var(--blue); background:#e8f1fe; color:var(--blue-d); font-weight:700;}
  .btn{display:block; width:100%; border:0; border-radius:14px; padding:15px; font-size:16px;
    font-weight:700; cursor:pointer; margin-top:12px;}
  .btn.primary{background:var(--blue); color:#fff;}
  .btn.primary:active{background:var(--blue-d);}
  .btn.ghost{background:#eef3fa; color:var(--blue-d);}
  .btn:disabled{opacity:.45;}
  .mode{display:flex; gap:8px;}
  .mode .seg{flex:1;}
  .qhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .qnum{font-size:13px; color:var(--muted); font-weight:600;}
  .qcat{font-size:12px; background:#e8f1fe; color:var(--blue-d); border-radius:999px; padding:4px 10px; font-weight:600;}
  .bar{height:8px; background:#e8eef6; border-radius:99px; overflow:hidden; margin:8px 0 14px;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--blue),#38bdf8); border-radius:99px;
    transition:width .3s;}
  .qtext{font-size:18px; line-height:1.45; margin:6px 0 16px; font-weight:600;}
  .opt{display:block; width:100%; text-align:left; border:2px solid var(--line); background:#fbfdff;
    border-radius:14px; padding:14px 15px; font-size:15.5px; margin:9px 0; cursor:pointer; color:var(--ink); line-height:1.4;}
  .opt:not(:disabled):active{border-color:var(--blue);}
  .opt.correct{border-color:var(--green); background:#e9f9ef; font-weight:600;}
  .opt.wrong{border-color:var(--red); background:#fdeaea; font-weight:600;}
  .opt.dim{opacity:.55;}
  .feedback{border-radius:12px; padding:12px 14px; font-size:14.5px; margin:12px 0 0; display:none;}
  .feedback.ok{display:block; background:#e9f9ef; color:#166534; border:1px solid #bbf7d0;}
  .feedback.no{display:block; background:#fdeaea; color:#991b1b; border:1px solid #fecaca;}
  .score-wrap{text-align:center; padding:8px 0 4px;}
  .ring{width:150px; height:150px; margin:6px auto;}
  .big{font-size:30px; font-weight:800; margin:8px 0 2px;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 6px;}
  .miss{border-top:1px solid var(--line); margin-top:14px; padding-top:10px; text-align:left;}
  .miss h3{font-size:15px; margin:8px 0;}
  .miss-item{background:#f6f9fd; border-radius:12px; padding:12px 14px; margin:10px 0; font-size:14px;}
  .miss-item .mq{font-weight:600; margin-bottom:6px; line-height:1.4;}
  .miss-item .ma{color:#166534;}
  .miss-item .mu{color:#991b1b; text-decoration:line-through;}
  .foot{color:#8fa3c2; text-align:center; font-size:12px; margin-top:18px;}
  .stat-row{display:flex; gap:10px; margin:12px 0;}
  .stat{flex:1; background:#f6f9fd; border-radius:12px; padding:10px; text-align:center;}
  .stat b{display:block; font-size:20px;}
  .stat span{font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>
<script>
const QUESTIONS = [{"t": "El Manual de Tripulación de Cabina Procedimientos Operativos está disponible para cada tripulante de cabina en formato digital, éste debe ser descargado desde:", "c": "Generalidades", "o": ["Copa Academy", "Sharepoint de Manuales Centralizados", "Copa Escucha", "Seguridad@copaair.com"], "a": 1}, {"t": "Es responsabilidad del Jefe de Cabina/Encargado de Vuelo mantener una copia física del manual, en cada vuelo, actualizado y accesible durante la operación.", "c": "Generalidades", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Cada Tripulante de Cabina es responsable de:", "c": "Generalidades", "o": ["Mantener actualizada la versión digital del Manual de Tripulación de Cabina Procedimientos Operativos.", "Mantener una versión actualizada del manual disponible ya sea física o digital para el ejercicio de sus funciones mientras está en servicio.", "El tripulante de cabina debe estar completamente familiarizado con el contenido del manual y cumplir con sus políticas y procedimientos.", "Todas son correctas."], "a": 3}, {"t": "Mantener actualizada la versión digital del manual es una responsabilidad del tripulante de cabina, para este fin, el uso de dispositivos electrónicos personales y/o proporcionados por la empresa están permitidos.", "c": "Generalidades", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Es responsable de la información del Manual de Procedimientos Operativos.", "c": "Generalidades", "o": ["El Departamento de Manuales Centralizados", "El Departamento de Servicio a Bordo", "El Departamento de Capacitación Operativa y Servicio al Cliente"], "a": 1}, {"t": "Es el responsable de la edición y de la notificación a los usuarios cuando surjan cambios en el Manual de Procedimientos Operativos.", "c": "Generalidades", "o": ["El Departamento de Manuales Centralizados", "El Departamento de Servicio a Bordo", "El Departamento de Capacitación y Servicio al Cliente"], "a": 0}, {"t": "Cuando dentro de la revisión del manual y/o boletines encuentre una línea vertical al lado izquierdo o derecho del texto y /o imagen, este corresponde a:", "c": "Generalidades", "o": ["La parte más importante del capítulo", "La última modificación efectuada a la página", "El párrafo resaltado para verificación de la próxima revisión."], "a": 1}, {"t": "Los boletines de alerta son publicados por el Departamento de Manuales Centralizados, el TCP, una vez recibida la notificación de actualización, debe:", "c": "Generalidades", "o": ["Actualizar su herramienta digital provista siguiendo los procedimientos establecidos por la aerolínea.", "Actualizar con cualquier herramienta que tenga a su disposición.", "Actualizar cuando sepa que tendrá una auditoría."], "a": 0}, {"t": "El tripulante de cabina debe insertar en su manual físico (cuando aplique) el boletín de alerta inmediatamente al recibirlo, leer el contenido de ellos y mantenerse pendiente de la fecha de aplicación que es comunicada por el Departamento de Estándares y Desarrollo.", "c": "Generalidades", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Pueden los colaboradores hacer declaraciones o apariciones en los medios de comunicación, en foros públicos o redes sociales donde se identifique o se atribuyan las mismas al personal de la aerolínea sin autorización previa.", "c": "Generalidades", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Los manuales, boletines, correspondencia, comunicaciones e información emitida por la aerolínea, son propiedad de la misma y no pueden divulgarse a personas extrañas a ella.", "c": "Generalidades", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En ningún momento un tripulante debe discutir, en la presencia de clientes o extraños, cualquier asunto que pusiera en duda la seguridad del funcionamiento de un vuelo.", "c": "Generalidades", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Se espera que los tripulantes cooperen totalmente con todos los colaboradores en el interés de lograr salidas a tiempo.", "c": "Generalidades", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Todo manual regulado (aprobado y/o certificado por las autoridades aeronáuticas civiles AAC o UAEAC) debe ser revisado como mínimo:", "c": "Generalidades", "o": ["Cada 2 años", "Una vez al año.", "Al 3er año"], "a": 1}, {"t": "Los manuales no regulados (manuales administrativos o manuales operativos) que no requieren de aprobación y/o certificación de parte de la autoridad por ser información no requerida en la regulación o bien información de manejo interno de la aerolínea deben ser revisados como mínimo:", "c": "Generalidades", "o": ["Cada 3 años", "Cada año", "Una vez cada dos años."], "a": 2}, {"t": "La cantidad máxima de boletines por manual es de ________. Una vez llegue a este límite, no se emitirán más boletines para el manual hasta que el mismo sea revisado y aprobado", "c": "Generalidades", "o": ["30", "20", "25", "15"], "a": 2}, {"t": "Según las limitaciones establecidas en el RACP el tiempo mínimo de descanso para un Tripulante de cabina debe ser:", "c": "Regulaciones AAC", "o": ["De 8 horas.", "De 24 horas.", "De 12 horas."], "a": 0}, {"t": "Tiempo de vuelo en operaciones con aviones, es el tiempo total transcurrido desde que el avión comienza a moverse con el propósito de despegar, hasta que se detiene completamente al finalizar el vuelo.", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La fatiga transitoria puede describirse como la fatiga que desaparece tras un suficiente período de descanso o de sueño", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La fatiga acumulativa se produce después de una recuperación incompleta de la fatiga transitoria durante un cierto período de tiempo.", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Según Marco regulatorio internacional de la industria de la aviación civil o Convenio sobre Aviación Civil Internacional (1944), ¿Cuál es el tratado normativo más importante con relación al Derecho Público Internacional Aeronáutico?", "c": "Regulaciones AAC", "o": ["Convenio de Chicago", "Reglamentación de la Aviación Civil de la República de Panamá", "Convenio de Tokio", "Convenio de Montreal"], "a": 0}, {"t": "El servicio comprende todas las tareas desempeñadas a solicitud del Operador y/o Explotador, incluyendo:", "c": "Regulaciones AAC", "o": ["La preparación previa al vuelo.", "La realización del vuelo.", "Las medidas después del vuelo.", "La instrucción impartida o recibida y horario de oficina", "Todas son correctas."], "a": 4}, {"t": "Un Período de Servicio incluye el período de tiempo para trasladarse desde la casa hasta el punto donde debe presentarse a trabajar:", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Este libro regula las configuraciones de la aeronave, el equipo de emergencia, procedimientos de seguridad, implementación del SMS, Gestión de la Fatiga aplicable a los operadores:", "c": "Regulaciones AAC", "o": ["Libro IX", "Libro VII.", "Libro XIV Parte I.", "Ninguna de las Anteriores."], "a": 2}, {"t": "Regula a los Estados y éstos a su vez trasladan ciertas responsabilidades de las aerolíneas.", "c": "Regulaciones AAC", "o": ["OACI", "IATA", "CBP", "Ninguna de las anteriores"], "a": 0}, {"t": "Agencia Federal del Departamento de Seguridad Nacional de Estados Unidos encargado de regular el comercio internacional.", "c": "Regulaciones AAC", "o": ["Federal Aviation Administration (FAA)", "Customs and Border Protection (CBP).", "Autoridad de Aeronáutica Civil (AAC)"], "a": 1}, {"t": "Período de tiempo que invierte un miembro de la tripulación en trasladarse de su residencia, hotel o lugar de descanso al lugar de trabajo o del lugar de trabajo a su residencia, hotel o lugar de descanso.", "c": "Regulaciones AAC", "o": ["Período de Reserva", "Período de Trabajo.", "Período de Descanso.", "Periodo de Traslado."], "a": 3}, {"t": "Según las limitaciones, en cuanto a tiempo de descanso y servicio, establecidas en el RACP, el Período Normal de Descanso programado aplicable a un Tripulante de cabina es:", "c": "Regulaciones AAC", "o": ["De 9 horas.", "De 24 horas.", "De 10 horas."], "a": 0}, {"t": "La Autoridad de Aeronáutica Civil (AAC) es la que regula la Aviación Civil en Panamá:", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La definición de período de descanso exige que se libere a los miembros de la tripulación de vuelo o de cabina de todas sus obligaciones para que se recupere de la fatiga.", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Existen diversos convenios que regulan a la aviación civil internacional con el objetivo que los países desarrollen leyes estandarizadas en el ámbito mundial.", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La inspección de manuales se realiza con el fin de actualizar los procedimientos establecidos en el Manual en cumplimiento con la AAC y OACI.", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Según las limitaciones, en cuanto a tiempo de descanso y servicio, establecidas en el RACP, el Tiempo Mínimo de Descanso debe ser de doce (12) horas consecutivas.", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Según las limitaciones, en cuanto a tiempo de descanso y servicio, establecidas en el RACP, se debe relevar al tripulante de cabina de todos los deberes por veinticuatro (24) horas consecutivas durante cualquier periodo de tres (3) días consecutivos.", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 1}, {"t": "El Tiempo de Servicio para los vuelos internacionales se comienza desde una (1) hora antes de la hora programada de salida hasta treinta (30) minutos después de su llegada.", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los inspectores de los reguladores y Autoridades de Aviación Civil están autorizados para realizar inspecciones relacionadas a los manuales.", "c": "Regulaciones AAC", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Inspección que se realiza al azar en los entrenamientos de cursos iniciales, recurrentes, recalificación, reentrenamientos, entre otros, con el fin de verificar la pro-eficiencia de los tripulantes de cabina.", "c": "Regulaciones AAC", "o": ["Inspección de Ruta.", "Inspección de Entrenamiento.", "Inspección de Registros.", "Inspección de Plataforma."], "a": 1}, {"t": "Máxima Autoridad en cuanto a las Regulaciones de la Aviación Civil Nacional en la Rep. De Panamá.", "c": "Regulaciones AAC", "o": ["Administración de Seguridad del Transporte (TSA)", "Autoridad Aeronáutica Civil (AAC)", "Administración Federal de Aviación (FAA)"], "a": 1}, {"t": "Las clases de fatiga que puede experimentar un miembro de la tripulación son:", "c": "Regulaciones AAC", "o": ["Descanso reducido.", "Transitoria y continua.", "Transitoria y acumulativa."], "a": 2}, {"t": "Se describe como fatiga que desaparece tras un periodo suficiente de descanso o de sueño.", "c": "Regulaciones AAC", "o": ["Fatiga acumulativa", "Fatiga transitoria", "Cansancio"], "a": 1}, {"t": "Es producto de la recuperación incompleta durante un cierto periodo de tiempo.", "c": "Regulaciones AAC", "o": ["Fatiga transitoria", "Fatiga acumulativa", "Cansancio"], "a": 1}, {"t": "En cuanto a la Revisión de seguridad de los aviones en los vuelos auditados a Estados Unidos y Canadá, el personal de seguridad contratado realiza la revisión interna del avión; bajo la siguiente condición:", "c": "Seguridad", "o": ["Los tripulantes asignados al vuelo no pueden estar a bordo del avión mientras esta verificación es completada. Si la tripulación está llevando a cabo el pre vuelo, deben detener la misma para así permitir al personal de seguridad cumplir con la verificación.", "La revisión puede ser realizada mientras el personal de limpieza se encuentra realizando sus funciones dentro del avión.", "Después que el personal de limpieza haya terminado en el avión y antes del abordaje de pasajeros.", "Este procedimiento no se contempla en nuestro Manual de Tripulación de Cabina Procedimientos Operativos."], "a": 2}, {"t": "En atención a la Seguridad de la cabina prevuelo y abordaje, antes del proceso de abordaje, se debe prestar atención a los bultos no autorizados, contenedores u otros artículos en la cabina, compartimientos superiores, galleys y baños. En los vuelos con segmentos, dicha verificación será eliminada.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 1}, {"t": "En cuanto al procedimiento de Seguridad en el abastecimiento, algunas estaciones en Estados Unidos y Canadá requieren que la tripulación ingrese simultáneamente a la aeronave, mientras se está llevando el proceso de “limpieza/seguridad”; siempre y cuando se cumpla con algún tipo de distanciamiento.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto al procedimiento de Seguridad en el abastecimiento, a la salida de un vuelo desde alguna de las estaciones dentro de los Estados Unidos y Canadá, el Catering a la salida de una aeronave podría realizarse en presencia de la Crew.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto al procedimiento de Seguridad en el abastecimiento, a la salida de un vuelo desde alguna de las estaciones dentro de Estados Unidos y Canadá, siga las instrucciones de los Agentes de SAP de Copa en el aeropuerto de tal manera que se respeten los requerimientos más recientes que apliquen a dicho aeropuerto en particular.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto al procedimiento de Seguridad en el abastecimiento, a la salida de un vuelo desde alguna de las estaciones dentro de Estados Unidos y Canadá, los Agentes de SAP de Copa en el aeropuerto podrían darnos las siguientes instrucciones:", "c": "Seguridad", "o": ["Ingresar a la aeronave luego de terminado el proceso de “limpieza/seguridad”.", "Ingresar simultáneamente a la aeronave, mientras se está llevando el proceso de “limpieza/seguridad”; siempre y cuando se cumpla con algún tipo de distanciamiento.", "Basadas en los requerimientos más recientes que aplican a dicho aeropuerto en particular.", "Todas son correctas."], "a": 3}, {"t": "En caso que se sospeche la presencia de bomba o artículos como armas y otros objetos/amenazas similares, en cuanto al procedimiento en conjunto con la Cabina de Mando, contamos como guía para búsqueda de tales artículos con:", "c": "Seguridad", "o": ["BOMB THREAT AID CARD", "Tarjeta verde APOYO PARA PROCEDIMIENTO DE AMENAZA DE BOMBA", "Formulario BOMB SEARCH CHECKLIST BOEING 737NG", "Este procedimiento no se contempla en nuestro Manual de Tripulación de Cabina Procedimientos Operativos."], "a": 2}, {"t": "Empleados del operador y/o explotador cuyas obligaciones están debidamente relacionadas con la conducción o planeamiento de vuelo o con el monitoreo en vuelo del equipo del avión o de los procedimientos de operación, si su presencia en la cabina de mando es necesaria para el desempeño de sus obligaciones, se les permite el acceso a la cabina de mando dentro del marco de lo descrito.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Para realizar el procedimiento para entrar a la cabina de mando: Baje la intensidad de las luces, pero nunca las apague por completo dejando la zona sin ninguna iluminación:", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto al procedimiento para el uso del Emergency Flight Deck Door Emergency Entrance panel para el ingreso a la Cabina de Mando en condiciones inusuales contamos con los siguientes sistemas:", "c": "Seguridad", "o": ["Push & Wait or Flight Deck Emergency Access Panel", "Push to Open y Press Enter", "Turn Handle y Turn the knob", "Todas las opciones son correctas"], "a": 0}, {"t": "Para la apertura de la cabina de mando en condiciones inusuales, una vez presionado el interruptor de bloqueo de la puerta en el marco derecho de la misma, el tripulante de cabina escuchará un pitido que dará inicio a la cuenta regresiva, cuya duración es de:", "c": "Seguridad", "o": ["3 segundos", "3 minutos", "30 segundos", "30 minutos"], "a": 2}, {"t": "En cuanto al procedimiento de cierre de puerta de la cabina de mando, una vez instruido por el capitán y antes de cerrar la misma, el JC notifica al capitán que procederá al cierre de la puerta de la cabina de mando y que colocará el switch de la puerta en posición:", "c": "Seguridad", "o": ["ON", "LOCK", "NORM", "Ninguna de las respuestas es correcta"], "a": 2}, {"t": "En cuanto al procedimiento para incidentes de seguridad a bordo, en el caso que un pasajero se queje o manifieste la existencia de una situación hacia otro pasajero que le genere incomodidad, garantice un cambio de asiento, como primer paso para la resolución del conflicto.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La aplicación de los niveles de seguridad, por parte de la tripulación de cabina, ante cualquier incidente presentado a bordo; se debe basar en los comportamientos observables de los pasajeros por parte de la tripulación de cabina.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Por su naturaleza, la conducta sexual inapropiada se refiere a acciones o comportamientos que son considerados socialmente inaceptables o que violan los límites de respeto y consentimiento en el ámbito sexual. Por su naturaleza este tipo de conducta es clasificada.", "c": "Seguridad", "o": ["En el nivel 4 de seguridad", "En el nivel 3 de seguridad", "En el nivel 2 de seguridad", "En el nivel 1 de seguridad"], "a": 2}, {"t": "En el caso de un evento de conducta sexual inapropiada (Sexual Misconduct) a bordo:", "c": "Seguridad", "o": ["Garantice un cambio de asiento, como primer paso, a la persona que presenta la queja", "Manténgase vigilante ante la generación de nuevas situaciones", "Por su naturaleza este tipo de conducta es clasificada en el nivel 2 de seguridad", "Todas son correctas"], "a": 3}, {"t": "Por su naturaleza, la trata o tráfico de personas, es clasificada en el:", "c": "Seguridad", "o": ["Nivel 1 de seguridad", "Nivel 2 de seguridad", "Nivel 3 de seguridad", "Nivel 4 de seguridad"], "a": 1}, {"t": "Una víctima de trata o tráfico de personas puede exhibir algunas de las características como:", "c": "Seguridad", "o": ["Evita el contacto visual y la interacción social", "No tiene control de su documentación", "No lleva ropa adecuada o no parece adaptarse a la ruta del viaje o al clima", "Todas son correctas"], "a": 3}, {"t": "Los tripulantes de cabina al detectar una posible víctima de tráfico de personas a bordo deben considerar hacer preguntas de forma discreta e indirecta, tales como:", "c": "Seguridad", "o": ["¿Por qué viajas? ¿Estás visitando familiares?", "¿Dónde te alojas? ¿Quién se reunirá con usted?", "¿Cuáles son tus planes?", "Todas son correctas"], "a": 3}, {"t": "Para el reporte de eventos, situaciones de seguridad o actos de interferencia ilícita, los canales disponibles son:", "c": "Seguridad", "o": ["AQD Cabin Safety o cualquier otro canal que la empresa disponga", "Correo seguridad@copaair.com", "Al portal www.copaseguridad.com", "Todas son correctas"], "a": 3}, {"t": "A la llegada de un vuelo hacia estaciones dentro de los Estados Unidos y Canadá, sólo se abre la puerta principal de abordaje para el desembarque de pasajeros y la tripulación. Queda prohibido abrir cualquier otra puerta por requerimiento de las autoridades locales.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Algunas estaciones en Estados Unidos y Canadá requieren que la Tripulación ingrese a la aeronave llevándose acabo procesos como:", "c": "Seguridad", "o": ["Luego de terminado el proceso de “limpieza/seguridad” o ingresar simultáneamente con algún tipo de distanciamiento.", "El Catering a la salida de una aeronave podría realizarse en presencia de la Crew.", "La TCP debe seguir las instrucciones de los Agentes de SAP del aeropuerto para garantizar cumplimiento de las normas de seguridad que apliquen a dicho aeropuerto.", "Todas son correctas."], "a": 3}, {"t": "Armas de fuego u otras armas peligrosas pueden ser aceptadas para su transportación dentro de la cabina de mando.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Este Nivel de Seguridad guarda relación con: Posesión/presencia de una bomba:", "c": "Seguridad", "o": ["Nivel 1", "Nivel 2", "Nivel 3", "Nivel 4"], "a": 3}, {"t": "La cantidad de pasajeros Deportados se limita a:", "c": "Seguridad", "o": ["Dos (2) por vuelo. Con la autorización conjunta del Gerente de Estación y del Departamento de Seguridad se determinaría el transporte de más de 2 deportados.", "Tres (3) por vuelo. Con la autorización del Gerente de Aeropuerto se determinaría el transporte de más de 3 deportados.", "Ninguna es correcta"], "a": 0}, {"t": "Son las personas responsables de transmitir la información de deportados o inadmisibles a la tripulación:", "c": "Seguridad", "o": ["El Capitán y Supervisores Rampa", "Personal de Servicios a Pasajeros y Jefe de Cabina/Encargado de Vuelo", "Personal de Servicio a Pasajeros y Supervisores de SAB."], "a": 1}, {"t": "Cantidad de pasajeros devueltos permitidos por vuelo es:", "c": "Seguridad", "o": ["2", "25", "Ilimitado.", "Ninguna de las anteriores."], "a": 2}, {"t": "Los escoltas pueden llevar armas, sustancia paralizante o cualquier otro elemento que puedan afectar la seguridad del vuelo en cabina de pasajeros:", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Área de riesgo mínimo para una bomba (LRBL), por si el personal anti-explosivo solicita dicha información, en aeronaves Boeing es:", "c": "Seguridad", "o": ["Cerca de la última fila del lado izquierdo.", "Puerta 2R.", "Cerca de la última fila del lado derecho.", "Puerta 2L."], "a": 1}, {"t": "Ningún objeto sospechoso o bomba debe ser tocado, manipulado o disturbado de ninguna manera por ningún empleado de la aerolínea.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En caso de encontrar un objeto sospechoso o que no tenga acompañante, este no debe ser movido por ningún motivo; inmediatamente se debe notificar al Capitán:", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El uso de las esposas en los custodiados es obligatorio durante el vuelo:", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Copa Airlines transporta prisioneros en vuelos internacionales teniendo en cuenta la política definida para esto: Por vuelo se permiten dos (2) prisioneros que no sean catalogados peligrosos, o un (1) prisionero catalogado peligroso.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los prisioneros catalogados peligrosos deben viajar acompañados por:", "c": "Seguridad", "o": ["Una escolta", "Dos escoltas", "No requiere escolta", "Ninguna es correcta"], "a": 1}, {"t": "Pasajeros deportados no son considerados prisioneros, por lo que no requieren escoltas.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La documentación del pasajero deportado o inadmisible es recibida por el Jefe de Cabina/Encargado de Vuelo y éste después de revisarlos se la entrega devuelta al pasajero.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Comportamiento o situación amenazante, agresiva o sospechosa es considerado:", "c": "Seguridad", "o": ["Nivel 1", "Nivel 2", "Nivel 3", "Nivel 4"], "a": 0}, {"t": "Abuso Físico corresponde a:", "c": "Seguridad", "o": ["Nivel 1", "Nivel 2", "Nivel 3", "Nivel 4"], "a": 1}, {"t": "Comportamiento que amenaza la vida corresponde a:", "c": "Seguridad", "o": ["Nivel 1", "Nivel 2", "Nivel 3", "Nivel 4"], "a": 2}, {"t": "Secuestro o intento de secuestro / violación a la cabina de mando corresponde a:", "c": "Seguridad", "o": ["Nivel 1", "Nivel 2", "Nivel 3", "Nivel 4"], "a": 3}, {"t": "En cuanto a la apertura de la puerta de la Cabina de Mando, se debe establecer comunicación vía intercomunicador, entre la TCM y la TCP para dar a conocer la intención de acceso a la cabina de mando, usando el nombre de quien llama y la frase: “Tengo la Zona Segura Establecida\".", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "A cualquier inspector de la Dirección de Seguridad Aérea, debidamente acreditado, se le debe dar acceso libre al compartimiento de pilotos del avión:", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La ubicación de un prisionero peligroso en un Boeing 737, es en la última fila en el medio de dos (2) custodios", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Antes del proceso de abordaje, debe prestar atención a los bultos no autorizados, contenedores u otros artículos en la cabina, compartimientos superiores, galleys y baños. Si los encuentra, notifique de inmediato a la cabina de mando o al personal de Servicios a Pasajeros.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si la tripulación continúa en el mismo avión, deben presentar su identificación cuando sea requerida por el personal de Servicio a Pasajeros.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Es el coordinador de seguridad abordo y debe mantenerse informado de cualquier disturbio con pasajeros o situación anormal que atente con la seguridad del vuelo.", "c": "Seguridad", "o": ["El Jefe de Cabina", "El Capitán", "a y b son correctas", "Ninguna de las anteriores"], "a": 1}, {"t": "En caso de que un pasajero desista de su vuelo estando abordo, algún miembro de la TCP debe preguntarle si ha retirado todo su equipaje de mano o pertenencias accesibles de cabina e informa al personal de Servicios a Pasajeros sobre la novedad y al Piloto al Mando para que esté informado al respecto:", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El TCP debe informar al agente de Servicios a Pasajeros el nombre y asiento asignado del cliente que desista de su vuelo estando abordo.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Se requiere que el personal de la aerolínea monitoree el proceso de abordaje de suministros en todas las Estaciones.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "De ocurrir alguna acción de un pasajero que amenace la seguridad, tendrá la última palabra en cuanto al transporte o remoción del pasajero de la aeronave.", "c": "Seguridad", "o": ["El Jefe de Cabina", "El Capitán", "El Gerente de aeropuerto", "Ninguna de las anteriores"], "a": 1}, {"t": "Persona que ha sido legalmente admitida a un país por sus autoridades o ha ingresado ilegalmente, y a la que posteriormente, las autoridades competentes de dicho país, ordenan formalmente la expulsión o destierro al país de su nacionalidad, ya sea por razones migratorias, políticas, penales o judiciales:", "c": "Seguridad", "o": ["Devuelto", "Inadmisible", "Deportado", "Ninguna de las anteriores"], "a": 2}, {"t": "Cuando la Autoridad de un país solicite a la aerolínea el transporte de más de 2 deportados, se requiere la autorización de:", "c": "Seguridad", "o": ["Del Gerente de Estación y del Departamento de Seguridad", "Supervisor en turno", "Del Jefe de Cabina", "A y C son correctas"], "a": 0}, {"t": "Es un pasajero que no cumple con los requisitos migratorios y el mismo es detectado directamente en el aeropuerto", "c": "Seguridad", "o": ["Devuelto / Inadmisible.", "Deportado", "Ninguna de las anteriores"], "a": 0}, {"t": "El prisionero y sus custodios son los primeros que abordan el avión y son los últimos en desembarcar. En la medida de lo posible, este embarque se hace por la puerta posterior.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El prisionero y sus custodios son ubicados en cualquier fila/asiento del avión.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Los prisioneros catalogados no peligrosos deben ir acompañados de un (1) escolta cada uno como mínimo.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si la duración de un vuelo internacional, es más de cuatro (4) horas, cada pasajero (prisionero no peligroso) debe ir acompañado de dos (2) escoltas.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto al transporte de prisioneros y sus escoltas en vuelos internacionales, por vuelo se permiten:", "c": "Seguridad", "o": ["Dos prisioneros que no sean catalogados peligrosos.", "Los prisioneros catalogados no peligrosos deben ir acompañados de un escolta como mínimo.", "Un prisionero catalogado peligroso, los cuales deben ir acompañados por dos escoltas.", "Todas son correctas"], "a": 3}, {"t": "Los escoltas no podrán llevar armas en cabina de pasajeros, deberán siempre llevarlas por bodega, cumpliendo con los lineamientos del procedimiento de transporte de armas por bodega:", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Procedimiento de sospecha de amenaza de bomba:", "c": "Seguridad", "o": ["Si el capitán lo solicita, informe a los pasajeros de la situación.", "Los TCP son los encargados de hacer la búsqueda. Todos los pasajeros deben permanecer sentados con todo su equipaje de mano colocado en su regazo.", "Todos los lugares accesibles durante el vuelo deben ser registrados.", "Busque algo extraño al avión y que no pertenezca a nadie que este abordo.", "Todas son correctas."], "a": 4}, {"t": "¿La Puerta 2R es el área de riesgo mínimo para una bomba en los Boeing?", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si un pasajero falla en cumplir con el requerimiento verbal consulte con el Capitán vía intercomunicador antes de entregarle al pasajero la parte escrita de NOTIFICACIÓN PARA CESAR UN COMPORTAMIENTO OBJETABLE/O ILEGAL.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Todos los TCP´s que son testigos de un incidente de nivel 1-4 en donde se haya entregado una NOTIFICACIÓN PARA CESAR UN COMPORTAMIENTO OBJETABLE / O ILEGAL escrita son responsables de llenar por separado el reporte de incidentes abordo.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Son violaciones temporales de las señales de información de seguridad, RAC o incidentes informados de abuso verbal, los cuales subsecuentemente son corregidos por el cliente después de un requerimiento verbal y/o una notificación escrita.", "c": "Seguridad", "o": ["Incidentes de nivel 1", "Incidentes de nivel 2", "Incidentes de nivel 3", "Incidentes de nivel 4"], "a": 0}, {"t": "Amenaza o acción de violencia física temporal y controlable:", "c": "Seguridad", "o": ["Incidentes de nivel 1", "Incidentes de nivel 2", "Incidentes de nivel 3", "Incidentes de nivel 4"], "a": 1}, {"t": "Son incidentes donde la acción de un cliente expone la seguridad de los otros clientes o la suya. Restricciones físicas son requeridas para prevenir que el cliente haga daños a otros clientes o a él mismo.", "c": "Seguridad", "o": ["Incidentes de nivel 1", "Incidentes de nivel 2", "Incidentes de nivel 3", "Incidentes de nivel 4"], "a": 2}, {"t": "Cuando el Capitán ha determinado que los clientes, la Tripulación o la aeronave están en peligro como resultado de un incidente de seguridad.", "c": "Seguridad", "o": ["Incidentes de nivel 1", "Incidentes de nivel 2", "Incidentes de nivel 3", "Incidentes de nivel 4"], "a": 3}, {"t": "Empleados, incluyendo tripulantes en comisión de servicio (deadheading), pueden estar sujetos a revisiones en los puntos de verificación de seguridad:", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las bombas están equipadas con tres componentes básicos:", "c": "Seguridad", "o": ["Caja, detonante, explosivo", "Fuente de poder, detonante, explosivo", "Explosivo, cronometro, baterías."], "a": 1}, {"t": "La tripulación asignada a un vuelo debe identificarse al llegar a la sala de abordaje con el personal de Servicios a Pasajeros designado al vuelo, portando siempre visible su carnet de identificación de la aerolínea antes de abordar el avión.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si el acceso al puente es controlado por una puerta con lector de tarjeta restringida para la tripulación y el personal de Servicios a Pasajeros no se encuentra al momento de la llegada, los tripulantes deben:", "c": "Seguridad", "o": ["Buscar al personal de Servicios a Pasajeros.", "Llamar a las oficinas de Servicio A Bordo.", "Esperar al agente antes de abordar el avión.", "Ninguna de las anteriores."], "a": 2}, {"t": "El Briefing que precede al vuelo ha de tomar lugar preferiblemente entre toda la tripulación. Sin embargo, éste puede llevarse a cabo entre el capitán y el/la JC/ encargado de vuelo y se debe hacer siempre al inicio de un día calendario iniciando un vuelo.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La parte de seguridad del Briefing entre el capitán y los tripulantes de cabina de pasajeros debe incluir los siguientes puntos:", "c": "Seguridad", "o": ["Cualquier información referente a la seguridad o posibles amenazas relativas al vuelo o a la aerolínea.", "Los métodos específicos dictados por el capitán para manejar emergencias, situaciones irregulares, incidentes o sucesos especiales.", "Los mecanismos de comunicación preferidos que utiliza la cabina de mando para alertar a los TCP, ya sea vía intercomunicador o por medio de timbres.", "Todas son correctas"], "a": 3}, {"t": "En cuanto a la revisión de seguridad de los aviones en los vuelos auditados a Estados Unidos y Canadá: El personal de seguridad contratado realiza la revisión interna del avión. Esta revisión debe ser realizada después que el personal de limpieza haya terminado en el avión y antes del abordaje de pasajero.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El equipaje personal de la tripulación, cuando no se encuentra almacenado en compartimientos designados para este fin, debe:", "c": "Seguridad", "o": ["Estar a la vista del tripulante en todo momento especialmente cuando se encuentra fuera de un área de seguridad.", "Este puede ser inspeccionado aleatoriamente por el personal de seguridad de la aerolínea o por parte de las autoridades.", "Todas son correctas"], "a": 2}, {"t": "La aerolínea tiene una política de no-consentimiento de discriminar a sus empleados tomando como base su religión, color, nacionalidad, edad, sexo, orientación sexual o cualquier otra clasificación. La aerolínea tiene la misma política hacia sus pasajeros, basándose en las mismas clasificaciones.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Estos son algunos requisitos para el transporte de pasajeros deportados o inadmisibles.", "c": "Seguridad", "o": ["El JC/Encargado de vuelo debe custodiar la documentación", "Notificar al capitán y asegurarse de entregar la documentación al JC/Encargado de vuelo para su custodia. Esta luego debe ser entregada al personal de Servicios a Pasajeros ya sea en la estación de tránsito o en el destino final.", "En caso que el deportado sin escolta o inadmisible tenga escala en PTY, el JC/Encargado de vuelo le entrega la documentación al personal de Servicios a Pasajeros, quienes a su vez la entregan al JC/Encargado de vuelo del próximo vuelo.", "Todas son correctas"], "a": 3}, {"t": "En el evento de que haya pasajeros deportados o inadmisibles que presenten un comportamiento indisciplinado o que su deportación guarde relación con la comisión de delito alguno, deben viajar debidamente escoltados y se debe seguir el procedimiento para el transporte de reos.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En caso de requerirse el uso de sanitarios por parte de alguno de los custodios o prisionero, deben tomarse las medidas necesarias para evitar riesgos adicionales.", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Cuando pasan a través de los puntos de verificación, los TCP serán pacientes y cooperadores. El personal de seguridad debe regirse por todas las disposiciones y procedimientos dictaminados por la AAC, verificando el cumplimiento de nuestro sistema de transporte:", "c": "Seguridad", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La aerolínea permite la compra de un asiento adicional para el transporte de carga en la cabina, por ejemplo: instrumentos musicales de gran tamaño.", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto al transporte de instrumentos musicales de gran tamaño, es importante que pueda asegurarse al asiento asignado comprado por el pasajero a través de los cinturones de seguridad, excluyendo la utilización de extensiones de seguridad:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Todo equipaje de la tripulación, dentro de la cabina de pasajeros, requiere estar almacenado en compartimientos de las aeronaves diseñados por el fabricante para llevar equipajes tanto en carreteo, despegue, aterrizaje:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Todo equipo de emergencia en los compartimentos superiores debe estar accesible y todos los compartimientos cerrados antes que la puerta de entrada se cierre.", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Cada equipaje de mano que no pueda ser almacenado en Cabina de Pasajeros debe:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Pagar por re-almacenamiento en bodega del avión y el TCP es responsable de gestionar el cobro.", "Ser entregado al personal de tierra para que se cumplan los procedimientos de chequeo de equipaje. Entregar al pasajero la colilla para que pueda reclamar su equipaje.", "Ninguna es correcta."], "a": 1}, {"t": "No se permite equipaje de mano en los compartimentos superiores o en otras áreas donde estos interfieran con:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["El acceso al equipo de emergencia por parte de la tripulación.", "La visión, bloqueando a los pasajeros observar los letreros de “NO FUMAR Y ABROCHARSE LOS CINTURONES o señales de SALIDAS”.", "Todas son correctas"], "a": 2}, {"t": "Si el tamaño de la silla de ruedas o artículos de asistencia es el adecuado, puede ser acomodado en el armario/closet", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si un pasajero requiere de una silla de ruedas u otro artículo de asistencia, debe ser entregado en la puerta del avión o en el área de entrega de equipaje.:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La ubicación de artículos de asistencia/sillas de ruedas en el armario/closet sigue el principio:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Pasajero con mayor estatus.", "Prioridad para Pasajeros Prefer.", "Primer Pasajero en abordar.", "Primer Pasajero Adulto Mayor en abordar."], "a": 2}, {"t": "Sólo se pueden asignar en un asiento de una Salida de Emergencia a:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Pasajeros que sean capaces, sin asistencia, de activar una salida de emergencia.", "Pasajeros capaces de tomar las acciones adicionales necesarias para asegurar la utilización segura de esa salida en caso de una emergencia.", "Todas son correctas"], "a": 2}, {"t": "Algunos criterios generales para la asignación de asientos en salidas de emergencia son:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["No debe asignarse pasajero menor de quince (15) años.", "Debe tener movilidad o destreza en ambos brazos, manos y piernas.", "No puede viajar con alguien que requiera cuidados especiales como un niño pequeño, un adulto mayor o de edad avanzada.", "Todas son correctas"], "a": 3}, {"t": "En caso de requerir cambiar de asiento a un cliente abordo, el tripulante le dará manejo dentro de la cabina y solo en caso de ser necesario solicitará la presencia del agente de servicio a pasajero quien realizará los cambios pertinentes en la asignación:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Antes de cerrar la puerta del avión el Agente de Tráfico debe recibir una verificación verbal del Tripulante de Cabina A/ Encargado del Vuelo que las salidas de emergencia están ocupadas por pasajeros calificados.", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Un pasajero necesariamente debe hablar español como lengua nativa para ser asignado a asientos en salidas de emergencia?", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Si un pasajero no comprende el comando para ser asignado a asientos de salidas de emergencias puede ser necesario lo siguiente:", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Dar las instrucciones en inglés y el comando en español.", "Si el tripulante considera la remoción, informe al Jefe de Cabina para verificación.", "El JC/encargado de vuelo debe hacer un cross check para comprobar la remoción. No se remueve al pasajero hasta que se confirme.", "Todas son correctas."], "a": 3}, {"t": "Si no está presente el Capitán en el momento de abordaje de un pasajero que aplica para ser rechazado su transporte, se debe contactar al Gerente de la estación, Supervisor de Servicios a Pasajeros para exponer las razones por la cual no puede abordar. A la llegada del capitán se le debe informar lo sucedido.", "c": "Programa de Equipajes y Asignación de Asientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En caso de amaraje, si usted escucha: “EASY VICTOR, EASY VICTOR”, grite el comando:", "c": "Emergencias", "o": ["\"Evacuación, Evacuación\" \"Suéltense Los Cinturones\"", "\"Suéltense Los Cinturones\" \"Dejen Todo”", "“Infle El Chaleco Póngaselo”", "\"Evacuación, Evacuación\" \"Suéltense Los Cinturones\" \"Saque El Chaleco\" \"Póngaselo\""], "a": 3}, {"t": "En cuanto a: Despegue abortado (rejected take off), una vez el avión se detenga por completo, se escuchará el comando:", "c": "Emergencias", "o": ["¡Easy Victor, Easy Victor!", "¡Evacuación, ¡Evacuación, ¡Suéltense los Cinturones, Dejen Todo!", "¡Passengers Remain Seated, Passengers Remain Seated!", "¡Inclínense cabeza abajo, Inclínense cabeza abajo!"], "a": 2}, {"t": "En un aborto de despegue si la condición de peligro es inminente el tripulante de cabina debe gritar y repetir el comando: ¡Inclínense Cabeza Abajo, Inclínense Cabeza Abajo!", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En un despegue abortado, si la condición de peligro es inminente la TCM emitirá el comando: ¡EASY VICTOR, EASY VICTOR!", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En un despegue abortado, si la condición de peligro es inminente y el capitán emite el comando ¡EASY VICTOR, EASY VICTOR! la TCP deberá:", "c": "Emergencias", "o": ["Evacuar lo antes posible.", "Verificar condiciones exteriores/ interiores.", "Utilizar los comandos correspondientes.", "Todas son correctas"], "a": 3}, {"t": "En la versión impresa del manual la lista de verificación para emergencias planificadas en tierra se identifica en color azul, y para amarajes planificados se identifica en color rosa.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Es responsable de confirmar en Briefing previo al vuelo, donde estará ubicado el manual impreso durante el vuelo de tal manera sea fácilmente accesible por cualquier miembro de la tripulación. En caso de una emergencia:", "c": "Emergencias", "o": ["Capitán.", "Jefe de Cabina/ Encargado de vuelo.", "Tripulantes de Cabina.", "Todas son correctas"], "a": 1}, {"t": "El SK aplica para aviones con matrícula HP (matrículas panameñas) operadas por Copa Colombia (Fleet Interchange). (Tabla 2.1 - Alerta)", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Es responsable de confirmar en Briefing previo al vuelo, donde estará ubicado el manual impreso durante el vuelo de tal manera sea fácilmente accesible por cualquier miembro de la tripulación en caso de una emergencia:", "c": "Emergencias", "o": ["Capitán.", "Jefe de Cabina/ Encargado de vuelo.", "TCP B.", "Todas las anteriores."], "a": 1}, {"t": "El JC/ Encargado de vuelo mantiene la zona segura establecida para el ingreso de cabina de mando y recibe el TEST por parte del capitán. El resto de la tripulación espera en el galley delantero con el manual.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En una evacuación, el TCP pide a los ABP que detengan a los pasajeros hasta que se les indique salir del avión.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los treinta (30) segundos de repaso incluyen:", "c": "Emergencias", "o": ["Posición de impacto (brace); Jumpseat mirando hacia atrás; Operación de su salida y alterna.", "Condiciones interiores; Condiciones exteriores; Comandos verbales.", "Asistentes potenciales ABP; Equipo de emergencia portátil.", "Todas son correctas."], "a": 3}, {"t": "El SK aplica para aviones con matrícula HP (matrículas panameñas) operadas por Copa Colombia (Fleet Interchange).", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En una Evacuación en Tierra, el ABP número tres (3) debe llevar a cabo las siguientes funciones:", "c": "Emergencias", "o": ["Detiene a los pasajeros hasta que la salida sea abierta.", "Dirige a los pasajeros a salir del avión.", "Cuando no es seguro permanecer a bordo, sale del avión.", "Todas son correctas."], "a": 3}, {"t": "En un Amaraje el ABP 3 lleva a cabo las siguientes funciones: Detiene a los pasajeros hasta que los ABP´s 1 y 2 hayan salido del avión;", "c": "Emergencias", "o": ["Dirige a los pasajeros a salir del avión;", "Cuando no es seguro permanecer a bordo, sale del avión, infla el chaleco, salta al agua por la parte delantera del ala y se agarra a los lados del deslizador (línea de vida).", "Todas son correctas."], "a": 2}, {"t": "Para pasajeros que no puedan adoptar la posición estándar o mamparo/primera fila, deberán sentarse con la espalda pegada al respaldar y la cabeza hacia el frente, barbilla pegada al pecho.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La posición BRACE en una silla con cinturón de seguridad de tres puntos el pasajero debe estar sentado apoyado al respaldar de su asiento y los tres (3) puntos del cinturón de seguridad deben estar ajustados y asegurados.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La posición de impacto para un adulto con un infante:", "c": "Emergencias", "o": ["Cinturón de seguridad ajustado al adulto solamente", "El adulto sostiene al infante de forma diagonal sobre el cuerpo, con la cabeza del infante en la parte suave del hombro, protegiéndole la Cabeza/Nuca", "El adulto se reclina hacia adelante, rostro hacia abajo.", "Todas son correctas."], "a": 3}, {"t": "En la posición de impacto para los TCP la espalda/cabeza deben estar pegadas al respaldar, la cabeza debe estar firme contra el espaldar del jump seat.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En los comandos desde la cabina de mando escucharemos “BRACE FOR IMPACT” ______ segundos antes del impacto).", "c": "Emergencias", "o": ["30", "15", "20", "60"], "a": 0}, {"t": "Una vez escuche el comando “INCLÍNESE CABEZA ABAJO”, “BRACE FOR IMPACT”:", "c": "Emergencias", "o": ["Emita y repita en voz alta el comando “INCLÍNESE CABEZA ABAJO”.", "Salga del jumseat y verifique condiciones exteriores e interiores.", "Repita el comando “Permanezcan sentados, permanezcan sentados”."], "a": 0}, {"t": "Para dirigir a los pasajeros a las salidas habilitadas se les dice: “VENGAN POR AQUÍ”.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Para dirigir a los pasajeros a las salidas habilitadas se les dice: “VAYAN PARA ALLÁ”.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Los comandos en las puertas en emergencia en tierra son:", "c": "Emergencias", "o": ["“SALTE Y DESLÍCESE”.", "“SIÉNTESE Y DESLÍCESE”.", "“ALÉJESE DEL AVIÓN”.", "Todas son correctas."], "a": 3}, {"t": "El TCP “C” es el encargado de operar las luces de emergencia, sin embargo, en caso de incapacidad, el TCP “B” debe activar el sistema.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Al verificar condiciones observe por peligro: Fuego, agua u otro solamente fuera del avión:", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Las evacuaciones deben realizarse de frente a los pasajeros", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Al bloquear una salida si la vía no es utilizable redirija a los pasajeros a las salidas alternas:", "c": "Emergencias", "o": ["Grite el comando “PELIGRO, POR AQUÍ NO”", "Grite el comando “CUIDADO, DIRÍJASE A OTRA SALIDA”", "Grite el comando “PELIGRO, DIRÍJASE A OTRA SALIDA” “PELIGRO, DIRÍJASE A OTRA SALIDA”"], "a": 2}, {"t": "Al controlar el flujo de pasajeros continuamente evalúe la condición de la salida.", "c": "Emergencias", "o": ["CIERTO", "FALSO"], "a": 0}, {"t": "Si una salida queda inhabilitada después de haber sido abierta, bloquee la salida y re dirija a los a pasajeros.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Cuando se encuentre con equipajes de mano en la salida pida al pasajero que lo retorne al compartimiento y continúe con la evacuación.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Cuando se encuentre con equipajes de mano en la salida láncelo fuera del avión.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Es mejor tirar el equipaje fuera o dejar que el pasajero salga con un equipaje pequeño que disminuir la salida de los pasajeros del avión.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Antes de abandonar el avión si no representa peligro para el TCP, toma la linterna y realiza una verificación en su área de responsabilidad por pasajeros y tripulantes que necesiten ayuda.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En una ventana de emergencia se infla el chaleco salvavidas inmediatamente después de haber salido del avión.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Entre las funciones del TCP B durante un amaraje están:", "c": "Emergencias", "o": ["Operar las luces de emergencia/ dirigirse hacia las ventanas de emergencia.", "Verifica condiciones exteriores / de ser favorables, habilita las ventanas de emergencia.", "Todas son correctas", "Hace barrido de su área."], "a": 2}, {"t": "¿Qué información recibe el JC/encargado de vuelo por parte del Capitán en el T.E.S.T.?", "c": "Emergencias", "o": ["Tipo de emergencia - ¿Evacuación será necesaria? - señal de impacto - tiempo para la evacuación.", "Tipo de evacuación - ¿Evacuación será necesaria? - señal de impacto-tiempo para la preparación.", "Tipo de emergencia esperada – Evacuación, ¿será necesaria o esta información es sólo para los miembros de la tripulación? - Señal de impacto, comando de evacuación o permanecer sentados - Tiempo disponible para la preparación.", "Ninguna es correcta."], "a": 2}, {"t": "En el caso de que el Capitán informara: “PASSENGERS REMAIN SEATED, PASSENGERS REMAIN SEATED”, los tripulantes de cabina deberán…", "c": "Emergencias", "o": ["Verifique condiciones interiores", "Indique a los pasajeros permanezcan sentados", "Evalúe condiciones exteriores en su salida asignada", "Espere instrucciones de la cabina de mando", "Todas son correctas."], "a": 4}, {"t": "El comando para los dos primeros ABP´s en una evacuación en tierra por puerta es:", "c": "Emergencias", "o": ["“Usted, salte y deslícese, aleje a los pasajeros del avión”.", "“Usted quédese abajo aleje a los pasajeros del avión, salte y deslícese”.", "“Usted quédese abajo aleje a los pasajeros del avión, salte y deslícese, aléjese del avión”."], "a": 1}, {"t": "Cuando el avión haya parado por completo, el Capitán dará el siguiente comando para iniciar la evacuación:", "c": "Emergencias", "o": ["“Easy Victor, Easy Victor”.", "“Suéltense los cinturones, dejen todo, vengan por aquí. Deténganse.”", "“Brace for impact”.", "“Inclínese cabeza abajo\"."], "a": 0}, {"t": "Para la instrucción de ABP’s en puerta, el tripulante debe utilizar la siguiente Tarjeta:", "c": "Emergencias", "o": ["Pluma y papel.", "Tarjeta Braile.", "Tarjeta de seguridad", "Ninguna es correcta."], "a": 2}, {"t": "En amaraje el comando en puertas es:", "c": "Emergencias", "o": ["\"Salga, pie primero, infle el chaleco, salte al agua, agárrese de los lados del deslizador\".", "\"Infle el chaleco, salte al agua, agárrese de los lados del deslizador\".", "\"Suéltense los cinturones, infle el chaleco, salte al agua, agárrese de los lados del deslizador\"."], "a": 1}, {"t": "En una emergencia, la preparación de ABP's debe realizarse antes de iniciar con la lista de verificación.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "La posición de impacto BRACE para pasajeros sentados frente a una mampara es:", "c": "Emergencias", "o": ["Cruzando los brazos y agarre la esquina del espaldar que se encuentra frente a usted, con los codos doblados, descanse la cabeza sobre los brazos, cara hacia abajo.", "Junte los brazos detrás de las rodillas o agárrese los tobillos. Descanse la cabeza sobre su regazo, cara hacia abajo.", "Ninguna de las anteriores."], "a": 1}, {"t": "Tipos de descompresión:", "c": "Emergencias", "o": ["Rápida y Lenta.", "Extrema y Ligera.", "Entrecortada y Rápida.", "Ninguna es correcta."], "a": 0}, {"t": "¿Cuál es la lista de verificación a usar en una emergencia en tierra?", "c": "Emergencias", "o": ["Lista de verificación color rosa.", "Lista de verificación Celeste.", "Lista de verificación Blanca.", "Tarjeta de seguridad."], "a": 0}, {"t": "En el caso de una turbulencia inesperada, de no ser posible o seguro ir a su jumpseat asignado, las acciones que debemos tomar son las siguientes:", "c": "Emergencias", "o": ["Sentarse en el piso, sujetándose de un objeto fijo o del cinturón abrochado de un pasajero.", "Tomar el asiento más cercano y ajustarse el cinturón de seguridad.", "Todas son correctas."], "a": 2}, {"t": "Los tipos de turbulencias son:", "c": "Emergencias", "o": ["Ligera, aire claro, extrema.", "Ligera, moderada, severa; las cuales pueden ser de aire claro", "Ligera, lenta, rápida, explosiva."], "a": 1}, {"t": "Las funciones del ABP #3 en una evacuación en tierra son:", "c": "Emergencias", "o": ["Detiene a los pasajeros, comanda y dirige a los pasajeros, cuando el área está despejada y no es seguro permanecer a bordo, sale del avión.", "Detiene a los pasajeros hasta que la salida sea abierta; dirige a los pasajeros a salir del avión; cuando no es seguro permanecer a bordo, sale del avión.", "Detiene a los pasajeros, sale inmediatamente, dirige a los pasajeros, cuando el área está despejada y no es seguro permanecer a bordo, sale del avión.", "Ninguna es correcta."], "a": 1}, {"t": "En amaraje el comando en ventanas de emergencia es:", "c": "Emergencias", "o": ["\"Salga pie primero, infle el chaleco, salte al agua, agárrese de los lados del deslizador\".", "\"Salga pie primero, deslícese por la parte trasera del ala, aléjese del avión\".", "\"Infle el chaleco, salga pie primero, salte al agua, agárrese de los lados del deslizador\"."], "a": 0}, {"t": "Comandos utilizados por el TCP para iniciar la evacuación", "c": "Emergencias", "o": ["EASY VICTOR, EASY VICTOR.", "Suéltense los cinturones dejen todo.", "“EVACUACIÓN, EVACUACIÓN”.", "Ninguna es correcta."], "a": 2}, {"t": "En una evacuación de emergencia, cuando un pasajero viaje con un animal de servicio, deberá sentarlo en su regazo cuando utilizan como vía de escape un deslizador.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Pasajeros discapacitados no-ambulatorios y sus acompañantes deberán ser evacuados después del mayor flujo de pasajeros.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En una evacuación no dirigida, debemos utilizar comandos positivos como:", "c": "Emergencias", "o": ["\"Siéntese, no puede estar de pie\", \"deténgase, permanezcan sentados\".", "\"PASAJEROS PERMANEZCAN SENTADOS\", \"DETENGANSE, PERMANEZCAN SENTADOS\".", "\"Alto, quédese sentado\", \"no puede estar de pie, deténgase, permanezcan sentados\"."], "a": 1}, {"t": "El tiempo útil de conciencia (TUC) es la cantidad de tiempo en la cual una persona es capaz de ejecutar efectiva o adecuadamente cualquier responsabilidad con una inadecuada cantidad de oxígeno.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Una de las responsabilidades del Coordinador en atención de un fuego es:", "c": "Emergencias", "o": ["Reubicar a los pasajeros.", "Utilizar el extintor apropiado y el equipo protector de respiración de ser necesario.", "Asegurarse que tenga disponibles PBE y extintores alternos.", "Todas son correctas."], "a": 2}, {"t": "Una de las responsabilidades del Comunicador en atención de un fuego es:", "c": "Emergencias", "o": ["Retirar del área las botellas de oxígeno más cercanas.", "Clasificar el fuego.", "Reubicar pasajeros lejos del área.", "Todas son correctas."], "a": 2}, {"t": "El equipo de demostraciones se utiliza para:", "c": "Emergencias", "o": ["Demostraciones de seguridad en aeronaves que no tengan soporte de video o tengan fallas de sistema.", "Pasajeros que requieran demostraciones individuales.", "Demostraciones de seguridad en emergencias con la lista de verificación.", "Todas son correctas."], "a": 3}, {"t": "Las 4 fases de una Evacuación son:", "c": "Emergencias", "o": ["Prepararse, Salir, Alejarse y Coordinarse.", "Prepararse, Partir, Alejarse y Comunicarse.", "Prepararse, Salir, Alejarse y Comunicarse.", "Prepararse, Salir, Acercarse y Comunicarse."], "a": 2}, {"t": "Los Tipos de Emergencia son:", "c": "Emergencias", "o": ["Planificadas y Por Planificar", "Planificadas y No Planificadas", "Planteadas y No Planteadas"], "a": 1}, {"t": "¿Cuál es el comando para que los pasajeros adopten una posición de protección para el impacto en una Emergencia?", "c": "Emergencias", "o": ["¡INCLINEN SUS CABEZAS ABAJO!", "¡INCLINENSE, CABEZA AL LADO!", "¡INCLINENSE, CABEZA ABAJO!", "¡INCLINENSE, CABEZA EN ALTO!"], "a": 2}, {"t": "Una vez la aeronave pare por completo y escucha, “PASSENGERS REMAIN SEATED,” usted debe:", "c": "Emergencias", "o": ["Verificar condiciones interiores y que los pasajeros permanezcan sentados, evalúe las condiciones exteriores de la salida contraria y espere instrucciones.", "Verificar condiciones interiores y permanezca sentado, evalúe las condiciones exteriores en su salida asignada y espere instrucciones de la cabina de mando.", "Verificar condiciones interiores y que los pasajeros permanezcan sentados.", "Verificar condiciones interiores, indicar a los pasajeros que permanezcan sentados, evaluar las condiciones exteriores en su salida asignada y esperar instrucciones de la cabina de mando."], "a": 3}, {"t": "Si escucha, “EASY VICTOR, EASY VICTOR” Verifique condiciones interiores y exteriores en su salida asignada, proceda inmediatamente con los comandos para iniciar la evacuación:", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En una situación donde el tripulante de cabina deba tomar una acción inmediata, a favor de la seguridad, el tripulante de cabina deberá realizar todos los esfuerzos necesarios para:", "c": "Emergencias", "o": ["Salir del Avión antes de 92 segundos.", "Contactar a la cabina de mando antes de iniciar una evacuación.", "Desplegar todos los deslizadores lo antes posible."], "a": 1}, {"t": "¿Una Evacuación no debe iniciarse hasta que el avión haya parado por completo y las turbinas hayan sido apagadas?", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En una emergencia planificada el JC/encargado de vuelo busca su manual y verifica con el capitán el TEST.:", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Los TCP preparan la cabina para una emergencia sólo si el capitán anticipa un aterrizaje anormal. Aterrizajes con precaución no necesariamente exigen una preparación de la cabina", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Según la disponibilidad de tiempo podremos preparar a los ABPs?", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Cuántos ABP se deben instruir para una emergencia?", "c": "Emergencias", "o": ["Dos (2) ABP por cada puerta;", "Tres (3) ABP por cada ventana;", "Un (1) ABP por salida bloqueada", "Todas son correctas."], "a": 3}, {"t": "Los 30 segundos de repaso incluyen, pero no limitan:", "c": "Emergencias", "o": ["Posición de impacto (Brace), Operación de su salida y alterna, Condiciones del equipaje, Comandos verbales, Asistentes potenciales ABP´s y Equipo de emergencia portátil.", "Posición de impacto (Brace), Operación de su salida y alterna, Condiciones interiores y exteriores, Comandos verbales, Asistentes potenciales ABP´s y Equipo de servicio portátil.", "Posición de impacto (Brace), Jumpseat mirando hacia atrás, Operación de su salida y alterna, Condiciones interiores y exteriores, Comandos verbales, Asistentes potenciales ABP y Equipo de emergencia portátil."], "a": 2}, {"t": "Los ABP deben ocupar los asientos más cercanos a la salida de emergencia en las que fueron instruidos para que les permita llevar a cabo las funciones.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Debe instruirse a los ABP sobre la operación de la salida en caso de que el Tripulante de Cabina esté incapacitado para hacerlo?", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Al juntarse los brazos detrás de las rodillas o agarrarse los tobillos, descansar la cabeza sobre su regazo, cara hacia abajo el pasajero estará asumiendo:", "c": "Emergencias", "o": ["Posición Brace Estándar.", "Posición Adulto cargando un infante.", "Posición Brace Mamparo/ Primera fila", "Posición del Tripulante."], "a": 2}, {"t": "¿Cuál es el comando para una salida bloqueada?", "c": "Emergencias", "o": ["“Peligro, salida bloqueada”.", "“Salida bloqueada, diríjase a otra salida”.", "“Peligro, diríjase a otra salida”.", "“Peligro, salida bloqueada, diríjase a otra salida”."], "a": 2}, {"t": "¿Cuál es el comando en las puertas para Emergencia en Tierra?", "c": "Emergencias", "o": ["“Salte y deslícese” – “Párese y deslícese”.", "“Salga y deslícese” – “Siéntese y deslícese”.", "“Salte y deslícese” – “Siéntese y deslícese” Aléjese del avión."], "a": 2}, {"t": "Se les debe explicar a los pasajeros que deben bloquear la salida si encuentran peligro como fuego/humo etc., durante el siguiente procedimiento:", "c": "Emergencias", "o": ["Briefing de ventana de emergencia.", "Preparación de ABP.", "Demonstración de seguridad"], "a": 1}, {"t": "En caso de encenderse la señal de ajustar el cinturón, el procedimiento a seguir es dar un anuncio y en lo posible, revisar que los pasajeros tengan el cinturón ajustado (Nota: El anuncio podrá ser encontrado en el Manual de anuncios).", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Al observar condiciones exteriores en un amaraje se verifica por el nivel del agua?", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El comando para una evacuación en puerta en un amaraje es: “Infle el chaleco, Salte al agua, Agárrese de los lados del Deslizador”.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En un amaraje el ABP #1 en ventana de emergencia lleva a cabo algunas de estas funciones:", "c": "Emergencias", "o": ["Detiene a los pasajeros hasta que la salida sea abierta.", "Verifica que la ventana sea expulsada del avión.", "Verifica condiciones exteriores; si hay agua o peligro, bloquea la salida y redirige a los pasajeros hacia otra salida."], "a": 2}, {"t": "En un amaraje el JC / Encargado de Vuelo lee los anuncios de la lista de verificación apropiada:", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los procedimientos a seguir al darnos cuenta de que hay un escape de presión son:", "c": "Emergencias", "o": ["Mueva a los clientes lejos de la rotura o escape inmediatamente. Solicite a los clientes que se ajusten los cinturones de seguridad.", "Si el escape es en una puerta, no toque el manubrio de la misma. El TCP ubicado cerca a la puerta con el escape deben reubicarse en los asientos de pasillo de la fila más cercana al área de responsabilidad.", "Notifique al Capitán y siga sus instrucciones. No coloque ningún artículo en el lugar del escape y mentalmente prepárese para una descompresión.", "Todas son correctas.", "Inicie inmediatamente una evacuación."], "a": 3}, {"t": "En el evento en que algunos compartimientos de máscaras de oxígeno se abran y estas caigan inadvertidamente debemos seguir el siguiente procedimiento:", "c": "Emergencias", "o": ["Informar a la Cabina de mando.", "Informar a los pasajeros que no activen ni usen las máscaras.", "En caso de haberlo activado reubicar a los pasajeros.", "Todas son correctas."], "a": 3}, {"t": "En caso de una turbulencia inesperada debemos:", "c": "Emergencias", "o": ["Tomar el asiento más cercano y ajustarse el cinturón de seguridad.", "Sostenerse del cinturón abrochado de un pasajero.", "Sentarse en el piso sujetándose de un objeto fijo.", "Todas son correctas."], "a": 3}, {"t": "En caso de humo en la cabina notifique al capitán de:", "c": "Emergencias", "o": ["Cantidad, olor, localización, distribución.", "Color, origen, localización, densidad.", "Color, olor, localización, densidad."], "a": 2}, {"t": "Los fuegos de clase B se deben apagar con extintor H2O.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Se provee oxígeno adicional con el POB de ser necesario en caso de descompresión.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Es responsabilidad de los tripulantes de cabina revisar los lavabos antes de cada despegue.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En el caso de un aborto de despegue (rejected take off) desde la Cabina de Mando, una vez el avión se detenga por completo, se escuchará el comando:", "c": "Emergencias", "o": ["“Inclínese cabeza abajo, Inclínese cabeza abajo, brace for impact “", "“SUÉLTENSE LOS CINTURONES DEJEN TODO”", "“PASSENGERS REMAIN SEATED, PASSENGERS REMAIN SEATED”", "“EVACUACIÓN, EVACUACIÓN”"], "a": 2}, {"t": "Una vez realizados todos los esfuerzos necesarios para contactar a la Cabina de Mando antes de iniciar una evacuación y si la condición de peligro es inminente, el tripulante de cabina debe:", "c": "Emergencias", "o": ["Gritar y repetir comandos", "Evacuar lo antes posible verificando condiciones exteriores", "Utilizar los comandos establecidos", "Todas son correctas."], "a": 3}, {"t": "La tripulación de cabina de pasajeros prepara la cabina para una emergencia sólo si el capitán anticipa un aterrizaje anormal", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En una emergencia, la responsabilidad del equipo portátil ELT/RT será la siguiente:", "c": "Emergencias", "o": ["Un ABP.", "JC/Encargado de vuelo.", "Tripulante C.", "JC/Encargado de vuelo y TCP B."], "a": 3}, {"t": "Entre las funciones del JC en preparación de la cabina durante una emergencia planificada tenemos:", "c": "Emergencias", "o": ["Recibir la información de los tripulantes, reportar pasos completados a los tripulantes.", "Transmitir la información vía intercomunicador, demostrar posición de impacto, supervisar que se practique.", "Transmitir la información en el galley delantero, dar anuncios correspondientes, instruir ABP´s para puerta de responsabilidad, informar al capitán.", "Transmitir una vez recibida la información inmediatamente a los pasajeros, revisar cinturones, mesas y respaldares, demostrar posición de impacto, recoger objetos sueltos de la cabina, retirar objetos punzantes."], "a": 2}, {"t": "En cuanto a la información sobre posición de impacto (BRACE) que debemos proporcionar a un adulto viajando con un infante tenemos:", "c": "Emergencias", "o": ["Cinturón de seguridad ajustado al adulto solamente", "El adulto sostiene al infante en forma diagonal sobre el cuerpo, con la cabeza del infante en la parte suave del hombro", "El adulto se reclina hacia adelante, rostro hacia abajo", "Todas son correctas."], "a": 3}, {"t": "Si hay la presencia de gasolina u otro líquido combustible volátil en la cabina:", "c": "Emergencias", "o": ["Notifique al capitán inmediatamente y siga sus instrucciones. Que nadie fume.", "Si el área donde se ha derramado el líquido no se ha encendido, cubra el área con frazadas empapadas en agua.", "Si el área se ha encendido, descargue el extintor de Halon en el área y cubra con frazadas empapadas en agua.", "Todas son correctas."], "a": 3}, {"t": "En una turbulencia ligera la señal de cinturones se encenderá a discreción del capi tán. Si la señal fue encendida, la TCP verifica que los pasajeros tengan los cinturones ajustados. Verifique que los infantes/niños estén en los asientos aprobados.", "c": "Emergencias", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "En una emergencia planificada, los anuncios de emergencia y las demostraciones se hacen primero y luego se procede con el resto de la lista de verificación, si el tiempo lo permite.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Cuando exista la posibilidad de una evacuación en el agua, en los B737NG, las puertas 2L y 2R, no deben ser utilizadas como salidas de emergencia a menos que no haya otra salida disponible.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los TCP que hagan las demostraciones se deben asegurar que los pasajeros con obstrucciones a la vista entiendan la posición de impacto.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto a la instrucción de ABP:", "c": "Emergencias", "o": ["Seleccione a los ABP y asegúrese que tienen la tarjeta de seguridad y que están sentados tan cerca como sea posible de su área de responsabilidad.", "Pídale a los ABP que detengan a los pasajeros.", "Instruya a los ABP que si usted está incapacitado debe removerlo del área para evacuar y ellos tendrán que realizar las acciones", "Todas son correctas."], "a": 3}, {"t": "En cuanto a la instrucción verbal a los ABP instrúyalo a evacuar tan pronto todos los pasajeros hayan desembarcado o cuando ya no sea seguro permanecer a bordo.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Funciones de los ABP durante un amaraje:", "c": "Emergencias", "o": ["Los ABP asisten a la TCP deteniendo a los pasajeros.", "Los ABP inflan el chaleco salvavidas, saltan al agua primero, se sujetan a los lados del deslizador e indican a los pasajeros para que hagan lo mismo.", "Instruirlos sobre la operación de la salida en caso que el tripulante de cabina esté incapacitado para hacerlo.", "Todas son correctas."], "a": 3}, {"t": "Las posiciones de seguridad para el impacto aumentan significativamente las posibilidades de supervivencia de los ocupantes de una aeronave.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Posición de impacto BRACE estándar para todos los pasajeros:", "c": "Emergencias", "o": ["Ajuste el cinturón abajo y apretado a su cadera;", "Inclínese hacia delante con los dos pies firmes en el piso, piernas ligeramente separadas;", "Cruce los brazos y agarre la esquina del espaldar que se encuentra frente a usted, con los codos doblados, descanse la cabeza sobre los brazos, rostro hacia abajo.", "Excepto si viajan con infantes o niños pequeños y aquellos sentados frente a un mamparo o en la primera fila.", "Todas son correctas."], "a": 4}, {"t": "Una de las situaciones de emergencia más crítica:", "c": "Emergencias", "o": ["La descompresión rápida/explosiva.", "La descompresión ligera.", "La descompresión extrema.", "La descompresión lenta."], "a": 3}, {"t": "En una descompresión, antes de iniciar el descenso, desde la cabina de mando se escuchará el comando:", "c": "Emergencias", "o": ["“PASSENGERS REMAIN SEATED”", "“DETÉNGANSE PERMANEZCAN SENTADOS”", "“ATTENTION CABIN CREW RAPID DESCENT”", "“ATTENTION CREW WE HAVE REACHED A SAFE ALTITUDE”", "Ninguna es correcta."], "a": 2}, {"t": "En el evento de una descompresión, una vez se alcance una altitud de cabina segura, se emitirá el comando desde la cabina de mando:", "c": "Emergencias", "o": ["“PASSENGERS REMAIN SEATED”", "“DETÉNGANSE PERMANEZCAN SENTADOS”", "“ATTENTION CABIN CREW RAPID DESCENT”", "“ATTENTION CREW WE HAVE REACHED A SAFE ALTITUDE”"], "a": 3}, {"t": "En cuanto a los procedimientos generales de la tripulación ante una descompresión, si el PA está accesible, instruya a los pasajeros a colocarse las máscaras de oxígeno y hacer uso de los cinturones de seguridad:", "c": "Emergencias", "o": ["Luego proceda a asegurarse y tome la máscara más cercana.", "Después de haber tomado la máscara más cercana y asegurarse.", "Provea oxígeno adicional con la POB de ser necesario en ese preciso momento.", "Ocupe lo más rápido posible su jumpseat y así poder dar los anuncios."], "a": 1}, {"t": "El TCP “B” es el encargado de operar las luces de emergencia, sin embargo, en caso de incapacidad, deberá activar el sistema (ELS):", "c": "Emergencias", "o": ["El TCP “A”", "El JC/Encargado de vuelo comparte esta responsabilidad.", "El TCP “C”", "El TCP “D”"], "a": 2}, {"t": "Los TCP después de una evacuación o amaraje deben, entre otras funciones:", "c": "Emergencias", "o": ["Agrupar pasajeros.", "Prestar primeros auxilios.", "Designar funciones y equipos a los pasajeros.", "Evitar que los pasajeros regresen al avión.", "Todas son correctas."], "a": 4}, {"t": "En cuanto a la supervivencia después de la evacuación, en el evento de un amaraje, los siguientes procedimientos son recomendaciones básicas:", "c": "Emergencias", "o": ["Si hay tiempo, lleve el FAK y cualquier otro equipo que pueda ser útil.", "Aléjese de las aguas saturadas de combustible.", "Brinde los primeros auxilios de ser posible.", "Todas son correctas."], "a": 3}, {"t": "Una evacuación no dirigida es cuando un tripulante evacúa un avión sin ser dirigido por el capitán", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "En una evacuación no dirigida, se requiere que un tripulante se dirija al área donde se inició la evacuación y continúe con el proceso de evacu
