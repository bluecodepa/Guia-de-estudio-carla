ación.", "c": "Emergencias", "o": ["Cierto", "Falso"], "a": 1}, {"t": "En una evacuación no dirigida, un tripulante deberá dirigirse al área donde se inició la evacuación y usará comandos positivos como:", "c": "Emergencias", "o": ["“PELIGRO, DIRÍJASE A OTRA SALIDA”", "“SALTE Y DESLÍCESE, ALÉJESE DEL AVIÓN”", "“DETÉNGANSE, PERMANEZCAN SENTADOS”", "Todas son correctas."], "a": 2}, {"t": "Los fuegos clase A se refiere a:", "c": "Emergencias", "o": ["Materiales combustibles.", "Líquidos inflamables.", "Eléctricos.", "Gasolina, aceites, grasa, solventes, pinturas."], "a": 0}, {"t": "Los fuegos clase B se refiere a:", "c": "Emergencias", "o": ["Materiales combustibles.", "Líquidos inflamables.", "Eléctricos.", "Sistemas de los galleys."], "a": 1}, {"t": "Los fuegos clase C se refiere a:", "c": "Emergencias", "o": ["Materiales combustibles.", "Líquidos inflamables.", "Eléctricos.", "Papel, madera, plásticos, caucho."], "a": 2}, {"t": "El pre vuelo es una revisión integral de la cabina de pasajeros de la aeronave, según las áreas de responsabilidad asignadas a los tripulantes de cabina y debe realizarse contemplando las 2 dimensiones de seguridad de manera paralela: Safety y Avsec.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Según el área de responsabilidad para la verificación pre vuelo por posición, los equipos de emergencias localizados en los compartimientos del techo le corresponden al:", "c": "Equipo de Emergencia", "o": ["Tripulante de cabina A", "Tripulante de Cabina B", "Tripulante de Cabina C", "Tripulante de Cabina D"], "a": 2}, {"t": "En vuelos donde los pasajeros han desembarcado y la tripulación de cabina realizará otro vuelo a continuación (y sin desembarcar de la misma), se debe realizar una verificación pre vuelo de los chalecos salvavidas y tarjetas de seguridad y criterio antes del siguiente abordaje.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Es requerido revisar el chaleco en el desembarque en estación si la tripulación de cabina desembarcará en su totalidad:", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Si durante el pre vuelo detectamos un asiento con faltante de chaleco salvavidas y no es posible reemplazarlo por no contar con la cantidad suficiente de unidades de reemplazo, se procede a:", "c": "Equipo de Emergencia", "o": ["Se bloquea el asiento como inoperativo.", "El asiento no puede ser utilizado por ningún pasajero", "Se reporta en bitácora y notifica al capitán", "Todas son correctas"], "a": 3}, {"t": "El deslizador de escape cuenta con luces para iluminación que duran:", "c": "Equipo de Emergencia", "o": ["5 minutos", "10 minutos", "15 a 20 minutos", "30 minutos"], "a": 1}, {"t": "El tiempo aproximado para que el deslizador se infle correctamente es de 4 segundos.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La máscara de RCP tiene varios nombres y todos se refieren al mismo producto: RES, máscara de rescate, máscara de bolsillo (Pocket mask o pocket resucitador)", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La máscara de RCP es un recurso opcional, de no ubicarse en el pre vuelo:", "c": "Equipo de Emergencia", "o": ["Deje constancia en la Bitácora de Cabina.", "Consulte el MEL", "Coordine con la tripulación", "Todas son correctas"], "a": 0}, {"t": "Durante la utilización del fire bag hay que agregar agua para enfriamiento, esto se debe realizar de forma periódica, aunque el fuego no persista.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Es requerido revisar el chaleco en el desembarque en estación si la tripulación de cabina desembarcará en su totalidad, y se realizará el prevuelo de equipos de emergencia ya sea por ellos mismos u otra tripulación asignada al siguiente vuelo de la aeronave:", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 1}, {"t": "La revisión del Survival kit aplica sólo para aviones con matrícula HP (matrículas panameñas) operadas por Copa Colombia (Fleet Interchange):", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El chequeo pre-vuelo de las sillas de rueda consiste en:", "c": "Equipo de Emergencia", "o": ["Verificación general y amarres de sujeción del equipo.", "Verificación general y que la silla funcione correctamente.", "Verificación general y que las ruedas funcionen correctamente."], "a": 0}, {"t": "El chequeo pre-vuelo del jumpseat del TCP consiste en:", "c": "Equipo de Emergencia", "o": ["Verificación general, que sea retráctil, arneses y cinturones operativos y en buen estado.", "Verificación general, que sea fijo y cinturones operativos.", "Verificación general, que sea retráctil."], "a": 0}, {"t": "Dentro del equipo para demostraciones encontramos:", "c": "Equipo de Emergencia", "o": ["Chaleco salvavidas, tarjeta de migración, máscaras de oxígeno y cinturón de seguridad.", "Chaleco salvavidas, máscaras de oxígeno, tarjeta de seguridad y criterio, cinturón de seguridad.", "Chaleco salvavidas, cinturón de seguridad y máscara resucitadora."], "a": 1}, {"t": "Copa Airlines cuenta con una tarjeta en sus aviones que contiene la información de seguridad e información sobre los requisitos de los pasajeros asignados en asientos en salidas de emergencias ubicada en cada bolsillo de asiento de pasajeros:", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los Resucitadores de RCP (RES) son una barrera plástica que cubre la boca y nariz que sirve para proveer un ambiente sano y seguro para llevar a cabo el RCP o respiración de salvamento:", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El equipo protector de respiración (PBE) cuenta con una capucha para proteger a la tripulación de los efectos del humo, gases tóxicos y vapores densos.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El equipo protector de respiración (PBE) cuenta con un protector de caucho que sella el cuello para evitar que el humo entre a la cámara respiratoria.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El equipo protector de respiración PBE tiene un visor plástico y una máscara oral/nasal que permite la inhalación de oxígeno y la comunicación.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La descripción del extintor de BTP (bromurotrifluoropropeno) es:", "c": "Equipo de Emergencia", "o": ["De color rojo, pasador de seguridad, sello de plomo.", "De color rojo, pasador de seguridad, palanca de activación y manómetro.", "De color rojo, cápsula de CO2 y pasador de seguridad."], "a": 1}, {"t": "La descripción del extintor Halon es:", "c": "Equipo de Emergencia", "o": ["Extintor color rojo, doble mango y capsula de CO2.", "Extintor color rojo, pasador de seguridad, palanca de activación y manómetro.", "Extintor color gris, mango giratorio y capsula de CO2."], "a": 1}, {"t": "Entre los puntos en la verificación pre-vuelo del extintor de Halon:", "c": "Equipo de Emergencia", "o": ["Sello de alambre en el mango.", "Anillo de seguridad en su sitio y asegurado y manómetro en la zona verde.", "Cápsula de CO2."], "a": 1}, {"t": "Una vez se detecta humo dentro del baño, una luz en el detector de humo se iluminará en color:", "c": "Equipo de Emergencia", "o": ["Verde", "Rojo", "Ambar"], "a": 1}, {"t": "¿Copa Airlines cuenta con equipo de supervivencia para terreno deshabitado (SK) en todos sus aviones?", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 1}, {"t": "El RT Beacon de ser utilizado para recibir y transmitir comunicación, emitirá señal por espacio de:", "c": "Equipo de Emergencia", "o": ["72 horas.", "24 horas.", "50 horas.", "65 horas."], "a": 1}, {"t": "Después de utilizar el POB este debe ser regresado a su lugar de almacenaje.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Aparato médico que interpreta los ritmos cardiacos:", "c": "Equipo de Emergencia", "o": ["Esfigmomanómetro.", "Estetoscopio.", "DEA.", "Ambu"], "a": 2}, {"t": "La revisión del Survival kit aplica sólo para aviones con matrícula HP (matrículas panameñas) operadas por Copa Colombia (Fleet Interchange).", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Para activar el generador de oxígeno del PBE debemos:", "c": "Equipo de Emergencia", "o": ["Colocarnos la capucha y respirar normalmente.", "Sacarlo del empaque y automáticamente se activa el flujo de oxígeno.", "Halar las dos correas al mismo tiempo hacia adelante.", "Encenderlo por medio de un interruptor."], "a": 2}, {"t": "El PBE genera oxígeno químico por un periodo de:", "c": "Equipo de Emergencia", "o": ["10 a 12 minutos.", "10 a 15 minutos.", "15 a 20 minutos.", "Solo por 15 minutos."], "a": 2}, {"t": "De encontrarse discrepancias en el equipo de emergencia los Tripulantes deben:", "c": "Equipo de Emergencia", "o": ["Reportar inmediatamente al supervisor de SAB para su reemplazo.", "Reportar inmediatamente al Jefe de Cabina/Encargado de vuelo, incluirlo en Bitácora de Cabina y notificar al capitán.", "Reportar al personal de Servicio a Pasajeros para que informen a Control."], "a": 1}, {"t": "Es importante verificar que los equipos de emergencia se encuentran en las áreas identificadas con las etiquetas de cada equipo.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los aviones varían en su configuración interior en cuanto a cantidad y/o ubicación de:", "c": "Equipo de Emergencia", "o": ["Salidas de Emergencia.", "Asientos y Baños.", "Jumpseat y Equipo de Emergencia.", "Todas son correctas"], "a": 3}, {"t": "Colocación del fire bag después de ser utilizado:", "c": "Equipo de Emergencia", "o": ["En el lavabo posterior y ciérrelo.", "En el penúltimo compartimiento superior lado izquierdo.", "En el armario de Clase Ejecutiva."], "a": 0}, {"t": "¿El propósito del fire bag es contener de forma segura incendios, explosiones, y todas las emisiones de humos tóxicos de dispositivos alimentados por baterías de iones de litios?", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La verificación del DEA HeartSine Samaritan 350P consiste en:", "c": "Equipo de Emergencia", "o": ["Verificación general.", "Verificación general, luz verde parpadeando.", "Verificación general, Luz naranja."], "a": 1}, {"t": "En la bolsa de extensiones de cinturones de seguridad debemos asegurarnos que las extensiones son compatibles con los cinturones de seguridad del avión y debemos contar con:", "c": "Equipo de Emergencia", "o": ["Cuatro (4) extensiones de cinturones de seguridad.", "Seis (6) extensiones de cinturones de seguridad.", "Cinco (5) extensiones de cinturones de seguridad."], "a": 1}, {"t": "La bolsa de chalecos salvavidas de repuesto debe contener 6 chalecos salvavidas", "c": "Equipo de Emergencia", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "Barrera plástica que cubre la boca/nariz que sirve para proveer un ambiente sano y seguro:", "c": "Equipo de Emergencia", "o": ["MK", "FAK", "RES", "PBE"], "a": 2}, {"t": "Las extensiones de cinturón tienen una etiqueta que las certifica como tal y se utilizan para reacomodar pasajeros obesos o embarazadas.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El pre vuelo del ELS consiste en:", "c": "Equipo de Emergencia", "o": ["En su lugar, sellado y asegurado", "Que esté apagado", "Verificación general. Protector en su lugar y en buen estado. Botón apagado.", "Que el protector del interruptor se encuentre en su lugar y apagado."], "a": 2}, {"t": "La bolsa contenedora de fuegos por baterías de litio contiene de forma segura incendios, explosiones y todas las emisiones de humo tóxico de dispositivos alimentados con iones de litio sin la ayuda de un suministro de agua.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La bolsa contenedora de fuego por baterías de litio (Fire Bag) contiene:", "c": "Equipo de Emergencia", "o": ["Guantes de asbesto", "Recogedor para fluidos", "Máscara protectora de fuego"], "a": 0}, {"t": "El deslizador de escape puede utilizarse como medio de flotación en un amaraje", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Para un amaraje, una vez el deslizador se infle, debemos levantar la cubierta que dice \"For Ditching Only\", tirar la manija “PULL” para separar el deslizador de la puerta.", "c": "Equipo de Emergencia", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto a la operación del chaleco salvavidas en infantes: Pase el chaleco sobre la cabeza del infante. Pase la cinta entre las piernas y sobre cualquiera de los hombros, abroche y ajuste la cinta al frente tirando del extremo, coloque el extremo de la cinta alrededor de la cintura por la parte interna del chaleco y amarre cerca del broche para evitar que se suelte. El restante de la cinta debe ser atado al extremo de la cinta del adulto responsable del infante.", "c": "Equipo de Emergencia", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "Duración de las luces de emergencia (ELS) en el BOEING 737:", "c": "Equipo de Emergencia", "o": ["4 a 5 horas.", "24 a 48 horas.", "15 a 20 minutos.", "10 minutos."], "a": 2}, {"t": "Las linternas de emergencia (EFL) operada por baterías. Duración:", "c": "Equipo de Emergencia", "o": ["4 a 5 minutos.", "4 a 5 horas.", "24 a 48 horas.", "24 a 60 horas."], "a": 1}, {"t": "En cuanto a la operación del equipo de neceser de precaución universal (UPK); después de verter el polvo granulado sobre el producto o fluido, para que haga efecto debemos dar mínimo:", "c": "Equipo de Emergencia", "o": ["30 segundos", "60 segundos", "90 segundos", "2 minutos"], "a": 3}, {"t": "La bolsa de extensiones de cinturones de seguridad debe contener: 6 extensiones de cinturones de seguridad.:", "c": "Equipo de Emergencia", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "La bolsa de chalecos salvavidas (SLV POUCH) debe contener:", "c": "Equipo de Emergencia", "o": ["5 chalecos salvavidas.", "6 chalecos salvavidas.", "12 chalecos salvavidas.", "14 chalecos salvavidas."], "a": 1}, {"t": "La duración del extintor Halon / BTP es de 8 segundos continuos, 25 segundos intermitentes.", "c": "Equipo de Emergencia", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "El POB no debe usarse cuando marque 500 PSI o cuando no se necesita más oxígeno.", "c": "Equipo de Emergencia", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "Primeros auxilios es la ayuda inmediata, limitada y temporal que se le da a una víctima de un accidente o enfermedad repentina hasta que llegue la asistencia médica.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Por cada minuto que se retrase la atención médica, se pierde el diez por ciento (10%) de posibilidades de vida.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Revisión del área: Verifique si el área es segura para usted y la víctima. De no estar segura, ASEGÚRELA. Esta acción la ejecuta el:", "c": "Primeros Auxilios", "o": ["Comunicador", "Auxiliar", "Rescatador", "Jefe de Cabina"], "a": 2}, {"t": "Los principios generales de acción en una emergencia médica son:", "c": "Primeros Auxilios", "o": ["Revisar, llamar, atender.", "En su lugar, sellado y asegurado", "Rescatador, auxiliar y comunicador"], "a": 0}, {"t": "Antes de atender: Si la victima está inconsciente la autorización es implícita. a Niños o Lactantes solicite autorización a padres o tutores", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los siguientes medicamentos que están dentro del FAK:", "c": "Primeros Auxilios", "o": ["Analgésico, antiemético, tabletas antiácidas y antihistamínico.", "Analgésico entre suave y moderado, antiácido, antihistamínico, dilatador bronquial.", "Analgésico entre suave y moderado, antiemético, antiácido, dilatador bronquial, cloruro de"], "a": 0}, {"t": "En cuanto al uso del Desfibrilador HeartSine Samaritan 350P, no apague el equipo ni retire el Pad Pack hasta que lo indique el personal del servicio de emergencias.", "c": "Primeros Auxilios", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "Signos-síntomas, ii) Alergias, iii) Medicación, iv) Patologías-padecimientos previos, v) Lunchúltimo alimento que ingirió, vi) Eventos que condujeron a la enfermedad o lesión.", "c": "Primeros Auxilios", "o": ["TEST", "SAMPLE", "COLD"], "a": 1}, {"t": "La respiración agónica no es un signo evidente de vida. Si no hay signo evidente de vida, ¿se debe iniciar RCP.?", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Tome nota de la especialidad, número de idoneidad e información de contacto. Si el Facultativo no cuenta con una licencia o carné, solicite el pasaporte. Es una acción que debe ejecutar el:", "c": "Primeros Auxilios", "o": ["Coordinador", "Comunicador", "Auxiliar", "Rescatador"], "a": 1}, {"t": "Al referirnos a una víctima sin signos vitales, utilizaremos la frase “Víctima Inconsciente”", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El FAK contiene algunos medicamentos que dependiendo de la dolencia son para ingerir por parte del paciente vía oral, estos son los únicos medicamentos que deben ser autorizados por un facultativo, personal de la salud o por parte Servicio Médico de Asistencia Virtual MEDLINK", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los principios generales de acción en una emergencia médica son: revisar, llamar, atender.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Uno de los tratamientos durante la atención a una persona desmayada, es elevar las piernas aproximadamente 12 pulgadas.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La hiperventilación es una respiración rápida y poco profunda que ocasiona un descenso del dióxido de carbono y un incremento en el nivel de oxígeno en el torrente sanguíneo.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La aplicación de compresas frías puede ayudar a controlar la hinchazón y a reducir el dolor como tratamiento para lesiones musculo-esquelética.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Shock es la falla del sistema circulatorio para mantener suficiente oxígeno en el torrente sanguíneo para que fluya a los órganos vitales del cuerpo.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "También se puede hacer compresiones en el pecho a aquellas personas a quienes no alcance a rodear con los brazos (embarazadas/obesos) o a personas en silla de ruedas.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Antes de aplicar el procedimiento de RCP, realice las siguientes evaluaciones:", "c": "Primeros Auxilios", "o": ["Evalúe nivel de conciencia, evalúe si la víctima respira.", "Evalúe nivel de conciencia, 2 soplos, evalúe si la víctima respira.", "Evalúe nivel de conciencia, compresiones, 2 soplos por 5 ciclos."], "a": 0}, {"t": "Para controlar una hemorragia externa siga los siguientes pasos:", "c": "Primeros Auxilios", "o": ["Cubrir la herida con una gasa estéril u otro apósito limpio y aplique presión directa con su mano enguantada hasta que cese el sangrado. Si la sangre empapa el primer apósito, coloque otro apósito por encima de este y continúe aplicando presión directa. Repita esta acción con apósitos adicionales según sea necesario.", "Considere la aplicación de un torniquete (extremidades superiores e inferiores).", "Prevenga el estado de Shock.", "Todas son correctas."], "a": 3}, {"t": "Para un avión autorizado a transportar de 101 - 200 pasajeros, la cantidad de botiquines de Primeros Auxilios (FAK) requerida es de:", "c": "Primeros Auxilios", "o": ["1", "2", "3", "4"], "a": 1}, {"t": "La llave reguladora de descarga para bebes y niños del DEA (Caja Roja) debe ser utilizada en bebes o niños cuyo peso sea:", "c": "Primeros Auxilios", "o": ["Menos de 55 libras.", "Más de 60 libras.", "Más de 40 libras."], "a": 0}, {"t": "Entre los servicios que ofrece Medlink están:", "c": "Primeros Auxilios", "o": ["Informar al Capitán que busquen a un facultativo a bordo.", "Brindar asesoría y guía sobre el procedimiento, hacer los arreglos necesarios para que especialistas en materias de salud estén esperando los aviones.", "Tener listos los snacks en la operación irregular al aterrizar en el aeropuerto alterno."], "a": 1}, {"t": "El Medical Kit cuenta con 2 tipos (colores) de sellos numerados.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Las máscaras de RCP (Pocket Mask) es un dispositivo que se usa para administrar respiraciones de rescate de manera segura durante un paro cardíaco o un paro respiratorio.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El tratamiento a seguir en caso de lesión en el ojo es:", "c": "Primeros Auxilios", "o": ["Que la víctima no se restriegue los ojos;", "Instruya a que parpadee, las lágrimas eliminarán las partículas. Si esto no resulta, incline la cabeza hacia el lado del ojo afectado y lave con abundante agua.", "Remueva partículas sueltas con gasa estéril;", "Pídale a la víctima que mantenga los ojos cerrados.", "Todas son correctas."], "a": 4}, {"t": "La técnica tracción de mandíbula se utiliza siempre para abrir las vías aéreas antes de iniciar la ventilación:", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 1}, {"t": "El atragantamiento es una obstrucción parcial o total de la vía área producido por un objeto no identificado.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Contamos con Dilatador Bronquial (inhalador) dentro del MK.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Tratamiento por agotamiento por calor:", "c": "Primeros Auxilios", "o": ["Mantenga a la persona reclinada; afloje la ropa;", "Aplique compresas frías y húmedas; mantenga el área ventilada (Abanique a la persona si es necesario", "Ofrézcale sorbos de agua si la persona está consciente y no está vomitando;", "Prevenga el estado de shock.", "Todas son correctas."], "a": 4}, {"t": "Parte del tratamiento en caso de hemorragia nasal: Siente a la víctima e indíquele que incline la cabeza hacia el nivel del pecho.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Ataques (convulsiones): ataques son desordenes marcados por disturbios eléctricos impulsados en el cerebro. Las causas pueden ser epilepsia, lesiones en la cabeza, sobre dosis de droga, enfermedad, fiebre alta (especialmente en los lactantes).", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Vómito, dolor de cabeza, sed intensa, boca seca y nauseas, son síntomas de:", "c": "Primeros Auxilios", "o": ["Coma diabético.", "Choque de insulina.", "Presión alta."], "a": 0}, {"t": "Las personas pueden tener una reacción alérgica a un medicamento, comida, picaduras de insectos, animales, etc. Se observarán los siguientes síntomas:", "c": "Primeros Auxilios", "o": ["Dificultad para respirar.", "Hinchazón en la cara, cuello, lengua o los labios.", "Opresión en el pecho o garganta.", "Reacciones en la piel (urticaria, picazón o enrojecimiento).", "Todas son correctas."], "a": 4}, {"t": "Una Emergencia Respiratoria es aquella en la cual la respiración se ha detenido o es tan atenuada que la inhalación de oxígeno es insuficiente para mantener la vida.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Desmayo o desvanecimiento es un período de inconciencia que se origina por la falta de sangre oxigenada en el cerebro.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los accidentes cerebro vascular (ACV) se producen cuando la sangre deja de fluir hacia el cerebro. Esto puede ocurrir si un vaso sanguíneo del cerebro se obstruye o se rompe.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El sello azul del Medical Kit (MK) indica:", "c": "Primeros Auxilios", "o": ["Que el equipo ha sido utilizado, pero no cuenta con las cantidades mínimas requeridas.", "Que el equipo está completo al ciento por ciento (100%)", "Que el equipo ha sido utilizado, pero cuenta con las cantidades mínimas requeridas."], "a": 1}, {"t": "El sello rojo del medical Kit (MK) indica:", "c": "Primeros Auxilios", "o": ["Que el equipo ha sido utilizado y no cuenta con las cantidades mínimas para su utilización.", "Que el equipo ha sido utilizado, pero cuenta con las cantidades mínimas requeridas.", "Que el equipo está completo al ciento por ciento (100%)"], "a": 0}, {"t": "El sello verde del Medical Kit (MK) indica:", "c": "Primeros Auxilios", "o": ["Que el equipo está completo al ciento por ciento (100%)", "Que el equipo ha sido utilizado, pero cuenta con las cantidades mínimas requeridas.", "Que el equipo ha sido utilizado y no cuenta con las cantidades mínimas requeridas."], "a": 1}, {"t": "El Sello Rojo del Medical Kit (MK) indica que el equipo ha sido utilizado, que no cuenta con las cantidades mínimas para su utilización y el mismo debe ser cambiado una vez el avión llegue a PTY.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "De encontrarse el Medical Kit (MK) con el sello rojo este debe ser reemplazado:", "c": "Primeros Auxilios", "o": ["En estación o en las Bases Panamá ó San José.", "Una vez el avión llegue a PTY.", "Ninguna es correcta"], "a": 1}, {"t": "La maniobra de atragantamiento para una persona consciente se aplica hasta que la víctima pueda toser con fuerza, hablar, llorar, respirar o expulsar el objeto.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La compañía fabricante del desfibrilador HeartSine Samaritan certifica que en víctima menores de ocho (8) años, o que pesen menos de 55 lbs (25 kg), es posible utilizar el PADs de adultos debido a que este equipo interpreta los signos vitales de la víctima y, de ser necesario, inicia las descargas gradualmente.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Para evaluar si una víctima respira observe si hay elevación de la caja torácica espontánea, mantenga la vía aérea abierta con la técnica de elevación frente mentón.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Dentro del FAK encontramos termómetros sin mercurio?", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Encontramos Máscaras RCP (RES) dentro del FAK?", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las quemaduras donde se visualizan tejido blando chamuscado (necrosis) son:", "c": "Primeros Auxilios", "o": ["Quemaduras de Primer Grado", "Quemaduras de Segundo Grado", "Quemaduras de Tercer Grado"], "a": 2}, {"t": "Para utilizar el DEA lo primero que hay que hacer es colocarle los Pads a la víctima.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Las quemaduras pueden ser superficiales o profundas y la atención de primeros auxilios para quemaduras incluye tres (3) pasos generales:", "c": "Primeros Auxilios", "o": ["Detener, enfriar y cubrir.", "Elevar, tapar y enfriar.", "Cubrir, enfriar y tapar."], "a": 0}, {"t": "Para el tratamiento del estado febril:", "c": "Primeros Auxilios", "o": ["Tome la temperatura.", "Siga las indicaciones de Medlink – Facultativo.", "Si es un niño, utilice compresas frías, de manera intermitente, por veinte (20) minutos.", "Todas son correctas."], "a": 3}, {"t": "Como parte del tratamiento de quemaduras de primer y/o segundo grado es necesario romper las ampollas y colocar vendaje.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Uno de sus síntomas consiste en dolor u opresión persistente en el pecho con una duración mayor de 3 a 5 minutos o que se alivia y reaparece:", "c": "Primeros Auxilios", "o": ["Hiperventilación.", "Shock.", "Ataque cardíaco.", "Todas son correctas."], "a": 2}, {"t": "Cuando una víctima muestra síntomas como: los ojos giran hacia arriba, su cuerpo se pone rígido con movimientos tensos violentos y dientes apretados con espuma en la boca; está presentando:", "c": "Primeros Auxilios", "o": ["Shock", "Apoplejía", "Agotamiento por calor.", "Ataque cardíaco.", "Ataques/convulsiones."], "a": 4}, {"t": "Cuando lo indique el personal de Servicio de Emergencia: apague el equipo y retire el Pad-Pak del DEA HeartSine Samaritan 350P:", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En el caso de pacientes de más de ocho (8) años o que pesen más de 55lbs. (25 kg), se le debe colocar un PAD verticalmente sobre el lado derecho del tórax del paciente y el otro horizontalmente a un costado del lado izquierdo.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si el paciente es menor de ocho (8) años o pesa menos de 55 lb (25 kg), se debe colocar un PAD en el centro del tórax y otro en el centro de la espalda.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En pacientes menores de ocho (8) años o que pesen menos de 55 lb (25 kg), es posible utilizar el PAD de adultos incluidos en el DEA Heartsine Samaritan 350P.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si escucha la instrucción, del DEA HeartSine Samaritan 350P, que le indica colocar los PADS firmemente en el tórax desnudo el paciente, compruebe que:", "c": "Primeros Auxilios", "o": ["Los PADS estén correctamente ubicados.", "Los PADS no se estén tocando y estén separados al menos 2.5 cm entre sí.", "Toda la superficie de cada PAD esté adherida a la piel desnuda. Si el tórax tiene vello, rasúrelo, y si está húmedo, séquelo.", "Asegúrese que el Pad-Pak no esté vencido, verificando la fecha de vencimiento en la parte posterior del Pad-Pak y que esté correctamente insertado en el dispositivo, comprobando que el indicador de estado esté en color verde.", "Todas son correctas."], "a": 4}, {"t": "Cuando el DEA le notifique la detección de un ritmo apto para descarga, apártese de la víctima.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Cuando el DEA le notifique que no se detecta un ritmo apto para descarga, usted debe:", "c": "Primeros Auxilios", "o": ["Continuar con el procedimiento de CAB.", "Verificar que el DEA esté funcionando correctamente.", "Continúe con el procedimiento de RCP de ser necesario.", "Desconectar los PADs y volver a colocarlos."], "a": 2}, {"t": "Cuando lo indique el personal de Servicio de Emergencia, apague el equipo (DEA) y…", "c": "Primeros Auxilios", "o": ["Entregue el DEA al Servicio de Emergencia.", "Retire los PADs del paciente.", "Retire el Pad-Pak del DEA.", "Todas son correctas."], "a": 2}, {"t": "Los PADS del DEA HeartSine Samaritan 350P siempre deben tener una separación entre ellos, de al menos:", "c": "Primeros Auxilios", "o": ["3.5 cm (2 pulgadas).", "2.5 cm (1 pulgada).", "4.5 cm (3 pulgadas).", "1.5 cm (1/2 pulgada)."], "a": 1}, {"t": "Si una persona tiene parches de nicotina, nitroglicerina o cualquier otro tipo de parche, retírelos para colocar nuestro PAD del lado derecho superior del pecho del paciente.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los PADS del DEA HeartSine Samaritan 350P siempre deben tener una separación entre ellos, de al menos 5cm (2 pulgadas).", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Para el uso del desfibrilador HeartSine Samaritan 350P debemos secar el pecho del paciente si está húmedo o sudado.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Para el uso del desfibrilador HeartSine Samaritan 350P debemos rasurar el lugar donde se colocarán los pads si el paciente tiene demasiado vello en el pecho.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Al momento de colocar los pads en el tórax desnudo del paciente y vuelve a escuchar la instrucción del DEA que indica “Colocar los pads firmemente en el tórax”, usted debe asegurarse que el Pad-Pak no esté vencido, verificando la fecha de vencimiento en la parte posterior del Pad- Pak y que esté correctamente insertado en el dispositivo, comprobando que el indicador de estado esté en color verde.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Cómo reconocemos un ataque cardíaco?", "c": "Primeros Auxilios", "o": ["Dolor u opresión persistente en el pecho, dolor en el pecho que se extiende a los hombros, falta de aire o dificultad para respirar, náusea y/o vómito, mareo, sudor.", "Dolor de cabeza, desfallecimiento, visión borrosa, posible dolor de estómago. Náusea, vómito, intranquilidad, ansiedad, confusión, pulso rápido.", "Espasmos musculares en manos y pies."], "a": 0}, {"t": "Tratamiento que debemos dar a un pasajero por Inconsciencia:", "c": "Primeros Auxilios", "o": ["Notifique al resto de la tripulación, Cabina de Mando y llame al Facultativo.", "Verifique si la víctima respira, si hay elevación de la caja torácica espontánea, mantenga la vía área abierta.", "Monitoree que la víctima sigue respirando", "Considere tratamiento por desmayo, prevenga el estado de shock.", "Administre oxígeno de ser necesario y vigile por si sufre cambios.", "Todas son correctas."], "a": 5}, {"t": "Síntomas de Hipotermia:", "c": "Primeros Auxilios", "o": ["Desorientación mental, perdida de la coordinación resultados de espasmos, temperatura corporal baja.", "Dolor de cabeza, desvanecimiento, hormigueo.", "Problemas de visión y sudor en exceso, respiración corta."], "a": 0}, {"t": "Consiste en una radio ayuda que tiene como base un hospital que ofrece orientación médica en caso de emergencias:", "c": "Primeros Auxilios", "o": ["Medlink.", "Cruz Roja.", "HCC y SOCC."], "a": 0}, {"t": "La inconsciencia es el estado en que la víctima ha perdido el conocimiento de forma súbita.", "c": "Primeros Auxilios", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las Heridas se clasifican en:", "c": "Primeros Auxilios", "o": ["Incisas y profundas.", "Leves, profundas y graves.", "Abiertas y cerradas."], "a": 2}, {"t": "Salida o derrame de sangre dentro y/o fuera del organismo como consecuencia de la rotura .", "Chequeador de línea durante los vuelos supervisados asignados.", "Un Supervisor de Vuelo durante su tercer vuelo en la línea.", "Todas son correctas"], "a": 1}, {"t": "Las siguientes son rutas potenciales de escape en amaraje:", "c": "Aviones", "o": ["Puerta principal de embarque (1L) y Puerta del galley posterior (2L), Ventanas de salida sobre las alas", "Puerta principal de embarque (1L) y Puerta del galley delantero (1R), Ventanas de salida sobre las alas, puertas 2L y 2R dependiendo del nivel de flotación y oleaje.", "Puertas 2L y 2R"], "a": 1}, {"t": "Si todas las salidas se encuentran bajo el nivel del agua y se requiere operar las puertas de salida, se deben desarmar los deslizadores antes de abrir las puertas:", "c": "Aviones", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las máscaras que suplen el oxígeno de emergencia de la cabina de pasajero, pueden ser activadas de tres (3) formas:", "c": "Aviones", "o": ["Eléctricamente, manualmente y automáticamente.", "Manualmente, electrónicamente y por vibración.", "Automáticamente, por turbulencia y manualmente."], "a": 0}, {"t": "El camino luminoso de escape de emergencia se activa automáticamente con la pérdida de energía eléctrica del avión.:", "c": "Aviones", "o": ["Cierto.", "Falso"], "a": 0}, {"t": "¿Qué cantidad de ABP´s preparamos para un amaraje?", "c": "Aviones", "o": ["3 ABP’S por cada puerta, 3 ABP’S por cada ventana y 1 ABP’S por salida bloqueada.", "2 ABP’S por cada puerta, 2 ABP’S por cada ventana y 1 ABP’S por salida bloqueada.", "2 ABP’S por cada puerta, 3 ABP’S por cada ventana y 1 ABP’S por salida bloqueada.", "2 ABP’S por cada puerta, 3 ABP’S por cada ventana y 2 ABP’S por salida bloqueada."], "a": 2}, {"t": "Para las actividades de entrenamiento “on the job training” y por evaluaciones dirigidas a los tripulantes de cabina las siguientes personas están autorizados a realizar la proeficiencia de puertas y prevuelo, abriendo y cerrando las puertas (1L/R, 2L/R):", "c": "Aviones", "o": ["Instructores de Capacitación / Instructores de Vuelo", "Chequeadores de Línea", "Inspectores de Aeronáutica Civil", "Todas son correctas"], "a": 3}, {"t": "Todos los tripulantes de cabina deberán cooperar con el proceso de pre vuelo y pro eficiencia de puertas como parte de la de demostración de competencias y conocimientos establecidos en el Manual de Procedimientos Operativos, ya en la posición que desempeñe en la actualidad o como parte de un proceso de ascenso.", "c": "Aviones", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Cuando el capitán alerta de una emergencia por medio de cuatro (4) timbres cuál es la indicación visual en el panel maestro de llamadas es:", "c": "Aviones", "o": ["Rosa intermitente", "Rosa", "Naranja intermitente"], "a": 1}, {"t": "Procedimiento para armar el deslizador de su puerta asignada:", "c": "Aviones", "o": ["Cruce la cinta sobre el visor, saque la barra del deslizador del montaje de la caja y colóquela firmemente en los soportes del piso hasta que quede debidamente asegurada.", "Saque la barra del deslizador del montaje de la caja y colóquela firmemente en los soportes del piso hasta que quede debidamente asegurada, cruce la cinta sobre el visor.", "Ninguna es correcta."], "a": 0}, {"t": "¿La seguridad operacional es el valor número 1 en Copa Airlines y es un elemento crítico de nuestra cultura organizacional?", "c": "SMS", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Todos los colaboradores sin excepción debemos garantizar que nuestras operaciones se lleven a cabo:", "c": "SMS", "o": ["Con el nivel más alto de desempeño de seguridad operacional.", "Con eficacia, eficiencia y cumpliendo con requerimientos regulatorios", "Protegiendo la vida e integridad de nuestros colaboradores, pasajeros, proveedores y aeronaves.", "Todas son correctas"], "a": 3}, {"t": "¿Un Sistema de Gestión de Seguridad (SMS) es un enfoque sistemático, integral y estructurado que una organización implementa para identificar, evaluar y mitigar los riesgos relacionados con la
