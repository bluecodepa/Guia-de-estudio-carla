:", "c": "SMS", "o": ["Modelo TEM", "Componente # 3 del SMS", "Se refiere al tercer enunciado del modelo de servicio", "Manejo adecuado de todas las habilidad4es dl CRM"], "a": 1}, {"t": "¿La Promoción de la seguridad operacional, conlleva a programar entrenamientos recurrentes a todos los colaboradores de Copa Airlines?", "c": "SMS", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Todos los colaboradores de Servicio a Bordo y demás áreas operativas tenemos una posición privilegiada durante la ejecución de nuestras funciones para:", "c": "SMS", "o": ["Identificar peligros y amenazas en la operación.", "Reportar los peligros, amenazas o eventos operacionales a través de los canales de reporte.", "Colaborar con los niveles gerenciales de SAB en la evaluación de los peligros, amenazas y riesgo identificados.", "Todas son correctas"], "a": 3}, {"t": "Todos los Tripulantes de cabina y colaboradores de SAB somos responsables de cumplir a tiempo con los entrenamientos de SMS programados asociados a nuestras funciones.", "c": "SMS", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Es responsabilidad del agente de SAP informar a los TCP cuando los clientes con necesidades especiales son abordados.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Se utiliza como herramienta para planificar la asistencia que brindamos los tripulantes de cabina a los pasajeros y saber con anticipación donde están ubicados.", "c": "Políticas y Procedimientos", "o": ["Guía de Servicio.", "Manual de Uniformidad.", "Final Report.", "Formulario de IRROPS."], "a": 2}, {"t": "Parte de la instrucción verbal de seguridad individual que se le ofrece al adulto mayor es:", "c": "Políticas y Procedimientos", "o": ["Preguntarle si nos brindara asistencia en una emergencia.", "Brindarle ejemplos de información valiosa de seguridad de la aeronave.", "Informarle que le asistiremos con sus medicamentos."], "a": 1}, {"t": "La aerolínea no niega el abordaje a ningún cliente tomando como base la discapacidad oporque ésta resultase en apariencia o en comportamiento involuntario molesto o que pudiera incomodar o causar algún inconveniente a la tripulación o a otros clientes:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si por razones médicas el pasajero no puede sentarse completamente erguido para el despegue y aterrizaje, se le podrá asignar un asiento reclinado localizado inmediatamente al frente de un mamparo, sin embargo, el cinturón de seguridad debe ir siempre ajustado.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los TCP somos responsables de garantizar a bordo de la aeronave la asistencia en lamaniobra para el traslado de los pasajeros desde y hacia la silla de rueda a su asiento en el avión.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La aerolínea provee servicio médico personalizado permanentemente en vuelo.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "A pesar que un cliente con discapacidad aparenta necesitar atención especial o asistencia en vuelo, esto no es razón suficiente para solictar que viaje con un acompañante.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El asistente personal que brinde ayuda permanente en un vuelo a otro pasajero, debe estar familiarizado con las atenciones personalizadas que el cliente requiera únicamente con las necesidades de medicamento.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Entre las funciones del asistente del pasajero que requiere de un acompañante, está el de asistirlo para moverse rápidamente a una salida en caso de evacuación de emergencia.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los TCP son responsables de asegurar previo al vuelo que todo cliente que viaje con animales de servicio o apoyo emocional complete y firme el Formulario Términos y Condiciones para transporte de animales de servicio y apoyo emocional en cabina.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Se podrá denegar el transporte en cabina del perro si tiene mal olor, ataca a otros pasajeros, mal comportamiento o no es capaz de controlar sus necesidades. De detectarse algunas de estas condiciones en el abordaje, la responsabilidad de los TCP es reportarlo al Capitán y al Gerente de SAP:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los TCP cuentan con un script para la presentación del briefing card una vez aborden aquellos pasajeros que viajen con un SVAN/ESAN y se encuentren en sus asientos.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Como procedimiento de seguridad, el TCP utilizando la tarjeta de seguridad y criterio le debe indicar al adulto viajando con un infante que se sostenga del espaldar delantero para despegue y aterrizajes en condiciones normales.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Siempre que sea posible anticipar una turbulencia moderada el Capitán instruirá la suspensión del servicio y los TCP deben asegurar los módulos en el galley.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las salidas de corrientes que estén en el Galley (incluidos los hornos) y salidas de USB del Crew Panel del IFE, pueden ser utilizadas para cargar eléctricamente los equipos electrónicos de los pasajeros y de la tripulación.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "En caso de un incidente o accidente, se debe elaborar un informe de seguridad en AQD y reportar en la bitácora de cabina los equipos de emergencia utilizados y ser presentados al Capitán para que sea reflejado en la bitácora de la aeronave.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La Bitácora de Cabina se utiliza para identificar y registrar discrepancias que afecten o no la aeronavegabilidad en cualquier etapa del vuelo: pre vuelo, durante el vuelo y post vuelo.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Como procedimiento alterno y sólo si es estrictamente necesario para asegurar una salida a tiempo, debido a una rotación corta en tierra, el briefing podrá ser realizado entre el capitán y el Tripulante Jefe de Cabina:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El número de mascotas permitidas en Cabina Principal es:", "c": "Políticas y Procedimientos", "o": ["Clase Ejecutiva: 1 mascota / Cabina Principal: 2 mascotas.", "Clase Ejecutiva: 2 mascotas / Cabina Principal: 1 mascota.", "Clase Ejecutiva: 0 mascotas / Cabina Principal: 3 mascotas."], "a": 2}, {"t": "En vuelos con duración menor a 1 hora, los Tripulantes de Cabina podrán iniciar sus actividades relacionadas con la preparación del servicio__________, siempre y cuando el capitán haya informado durante el briefing que existirán condiciones meteorológicas apropiadas:", "c": "Políticas y Procedimientos", "o": ["Después de reciclado la señal de abrocharse los cinturones.", "3 minutos posteriores al despegue.", "Después que el jefe de cabina lo autorice.", "13 minutos posteriores al despegue."], "a": 1}, {"t": "Mujeres embarazadas pueden ser aceptadas para su transportación:", "c": "Políticas y Procedimientos", "o": ["Después de los 5 meses de embarazo.", "Después de los 3 meses de embarazo.", "Hasta los 7 meses de embarazo.", "En cualquier etapa del embarazo."], "a": 3}, {"t": "La definición de un Menor sin Acompañantes es la siguiente:", "c": "Políticas y Procedimientos", "o": ["de 8 a 18 años pueden ser aceptados para vuelos directos y vuelos con conexión con la misma aerolínea.", "Menores cuya edad se encuentre entre los 5 y 14 años de edad son aceptados.", "Un menor puede viajar sin necesidad de una reservación y una confirmación del asiento. Niños"], "a": 1}, {"t": "Los documentos de viaje del menor sin acompañante deben ser:", "c": "Políticas y Procedimientos", "o": ["Responsabilidad del menor.", "Custodiados por el Capitán del vuelo.", "Custodiados en todo momento por el personal de la aerolínea, el sobre no debe ser entregado al menor sin acompañante en ningún momento."], "a": 2}, {"t": "El programa de Alcohol y Drogas de Copa Airlines establece la Política de la Organización en esta materia el cual es adoptado por todas las áreas y es aplicable a la Tripulación de Cabina. El marco de referencia que habla sobre el Programa de Alcohol y Droga de la Compañía, es:", "c": "Políticas y Procedimientos", "o": ["Manual Administrativo de Copa Airlines MA-RRH-02 Programa de Alcohol y Drogas.", "Manual de Alcohólicos Anónimos para CM.", "Programa de Alcohol y Droga de la AAA", "Manual de Drogas permitidas e ilícitas."], "a": 0}, {"t": "Término que se utiliza para hacer referencia a un pasajero bajo la influencia de alcohol o droga:", "c": "Políticas y Procedimientos", "o": ["Cliente que se encuentra en estado de ebriedad.", "Persona intoxicada.", "Cliente que presenta síntomas de intoxicación.", "Cliente bajo la influencia de alucinógenos"], "a": 2}, {"t": "Los tripulantes de cabina tienen la responsabilidad legal de asistir a los clientes con necesidades especiales durante el abordaje, en el vuelo como también en el desembarque:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los Tripulantes de cabina deben llamar a la cabina de mando para solicitar autorización de inicio del servicio o para ofrecer bebidas a la tripulación de vuelo cuando se escuche el timbre de los 10,000 pies.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Cliente capaz de abordar, desembarcar y moverse a través del avión sin asistencia:", "c": "Políticas y Procedimientos", "o": ["No Ambulatorio.", "Cliente lesionado", "Persona con discapacidad temporal.", "Ambulatorio."], "a": 3}, {"t": "¿Se le debe ofrecer un briefing personalizado a menores viajando con adultos, pero en asientos separados?", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Personal con la autoridad de negar el embarque y/o remover del avión a un pasajero:", "c": "Políticas y Procedimientos", "o": ["Jefe de Cabina y Agente de Servicio a Pasajero.", "Supervisor de Aeropuerto y Capitán.", "Jefe de Cabina y Supervisor de Servicio Abordo."], "a": 1}, {"t": "Dentro de los animales considerados de servicio y apoyo emocional, son permitidos abordo:", "c": "Políticas y Procedimientos", "o": ["Perros y gatos.", "Solo perros.", "Perros, gatos, monos."], "a": 1}, {"t": "Si un pasajero expresa su incomodidad y no quiere tener cerca a un cliente viajando con animal de servicio, usted debe:", "c": "Políticas y Procedimientos", "o": ["Coordinar con servicio a pasajero otro asiento para la persona que viaja con el animal de servicio.", "Reubicar de asiento al cliente que ha presentado su incomodidad.", "Informar al Capitán para tomar una decisión.", "Todas las anteriores.\n<Página 9.12\tpunto 9.1.6.8.1.e"], "a": 1}, {"t": "La aerolínea transportará una cantidad de menores sin acompañante de hasta:", "c": "Políticas y Procedimientos", "o": ["10", "15", "20", "25"], "a": 3}, {"t": "Se debe instruir a los pasajeros viajando en ventana de emergencia en el siguiente orden:", "c": "Políticas y Procedimientos", "o": ["Primero las filas de un lado y luego del otro.", "Por grupo de pasajeros", "Individualmente", "Ninguna de las anteriores"], "a": 0}, {"t": "CRM se refiere al uso efectivo de todos los recursos disponibles: Recursos Humanos, Equipos y Herramientas e Información:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El modelo TEM enfatiza en tres conceptos básicos: Preparar, Reparar y Recuperar.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las amenazas se definen como eventos que ocurren fuera de la influencia de la tripulación de vuelo, aumentan la complejidad operativa de un vuelo y requieren atención y gestión de la tripulación para mantener los márgenes de seguridad.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Es Obligatorio que el JC/Encargado de vuelo promueva y reitere la importancia de mantener el uso de los dispositivos electrónicos según lo establecido en el manual:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los errores se definen como acciones o inacciones de la tripulación que conducen a una desviación de las intenciones o expectativas de la tripulación o la línea aérea, reducen los márgenes de seguridad y aumentan la probabilidad de eventos operativos adversos en tierra o durante el vuelo.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los errores pueden ocurrir como resultado de una reacción humana espontánea donde no hay amenazas presentes o como una forma de manejar mal las amenazas existentes:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los tripulantes de cabina son responsables de la aceptación de la mascota y de verificar toda la documentación requerida para su transporte:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Uno de los requisitos para el transporte de mascotas en la cabina es que no se aceptaran mascotas de menos de 16 semanas:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El término “COMAT” en aviación se refiere a Company Material o Company Owned Material, se utiliza para describir cualquier equipo, pieza de repuesto, herramienta o material que pertenece y es gestionado por una aerolínea para el mantenimiento y operación de sus aeronaves.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si ocurre una descontinuación del aterrizaje (Missed Approach) por parte del capitán, el jefe de cabina apoya con anuncios a los pasajeros expresando que es un procedimiento normal y la importancia de permanecer sentados con sus cinturones de seguridad ajustados.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Todos los tripulantes de cabina somos responsables de operar las puertas de la aeronave, desde afuera como desde adentro.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "La utilización de cigarrillos electrónicos es permitida a bordo de los aviones de Copa Airlines.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Es el único miembro de la tripulación con la autoridad para determinar, según el MEL, si el vuelo puede o no salir con la discrepancia reportada.", "c": "Políticas y Procedimientos", "o": ["Capitán", "Primer oficial", "Jefe de Cabina / Encargado de vuelo", "Inspector de la AAC"], "a": 0}, {"t": "Para extinguir un fuego provocado por una batería de ión litio / metal litio solo se debe utilizar el extintor de halon:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "En todo momento los tripulantes de cabina deben obtener las credenciales apropiadas y presentarlas al capitán para poder aprobar la admisión a la cabina de mando.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿En qué momento se procede a desarmar los deslizadores?", "c": "Políticas y Procedimientos", "o": ["Una vez se apaga la luz de cabina estéril y el jefe de cabina diga el anuncio.", "Una vez el avión se detiene en el puente y la señal de abrocharse los cinturones haya sido apagada.", "Una vez el avión se detiene en el puente y el jefe de cabina diga el anuncio."], "a": 1}, {"t": "Si hay un artículo inoperativo que afecta la aeronavegabilidad del avión y está anotado en la bitácora de la cabina, la Tripulación de Vuelo debe transferir este elemento a la Bitácora de la Aeronave para ser reparado o diferido.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿El Equipo de emergencia, puede ser reportado en la Bitácora de Cabina, pero debe ser traspasado a la Bitácora del Avión?", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto al manejo de clientes lesionados: no importando que tan pequeño sea el incidente y aunque el cliente indique que todo está bien, el reporte será necesario.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En aviones equipados con sistema de video, los tripulantes deben pararse en su posición para la demostración de seguridad con el equipo de demostración disponible y realizar las mismas en caso de presentarse un mal funcionamiento o calidad pobre en la presentación.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La revisión de los documentos de vuelo debe ser realizada por el Jefe de cabina/Encargado de vuelo quien a su vez le presenta sus documentos al Tripulante de Cabina que le siga en la cadena de mando.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si el pasajero manifiesta que el animal está brindando un servicio de asistencia, bastará para ser aceptado.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Parte de los 30 segundos de repaso incluye:", "c": "Políticas y Procedimientos", "o": ["Posición de impacto, comandos verbales.", "Operación de su salida y la alterna.", "Condiciones interiores y exteriores.", "Todas son correctas."], "a": 3}, {"t": "Si se sospecha que hay un material peligroso biológico o químico a bordo y se determina que la sustancia posee una amenaza creíble, proceda a cubrir el material con una manta húmeda para prevenir que el material se riegue por todo el avión.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las luces que puedan interferir con la visión nocturna de la cabina de mando deben ser bajadasa tenue antes de entrar a la cabina.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si sucediera un disturbio causado por un pasajero que presenta síntomas de intoxicación por alcohol debemos:", "c": "Políticas y Procedimientos", "o": ["Notificar a la cabina de mando, haciendo referencia a la condición del cliente, Iniciar con los incidentes de seguridad abordo.", "Entregar la Tarjeta de Criterio.", "Coordinar con el personal médico del aeropuerto."], "a": 0}, {"t": "Definición de un pasajero no ambulatorio:", "c": "Políticas y Procedimientos", "o": ["Cualquier cliente con algún impedimento físico o mental ya sea temporal o permanente, tiene un registro de dicho impedimento o está consciente que padece del mismo.", "Cliente que requiere de asistencia para abordar, desembarcar o moverse a través del avión.", "Un cliente con alguna discapacidad que obtiene un tiquete de la forma correcta, pero debe ser tratado como cualquier cliente sin discriminación alguna."], "a": 1}, {"t": "¿Es permitido asignar un asiento de ventana de emergencia a una persona viajando con un animal de servicio?", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "El Briefing personalizado a pasajeros sordos incluye, pero no se limita a:", "c": "Políticas y Procedimientos", "o": ["La comunicación con este tipo de clientes es de forma gesticular o escrita si es el caso.", "Es muy importante que el TCP encargado del área donde se encuentre el cliente, esté atento para indicarle de acuerdo con la fase del vuelo el uso del cinturón y demás instrucciones que sean necesarias.", "Hacer que lea la Tarjeta de Instrucción.", "Todas son correctas"], "a": 3}, {"t": "Podemos ubicar cargadores de infantes en las filas antes de la ventana de emergencia", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Es requerido que los tripulantes de cabina verifiquen que los PED estén en modo avión:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Los reportes en la bitácora deben ser registrados en el idioma español:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "El Briefing del Jefe de Cabina/Encargado de vuelo debe incluir, pero no se limita a:", "c": "Políticas y Procedimientos", "o": ["Revisión de documentos y conteo de frazadas y almohadas.", "Presentación de la tripulación/posiciones y revisión de documentos.", "Certificado médico aeronáutico y usuario de somoscopa.com"], "a": 1}, {"t": "¿Es el Agente de Tierra (Servicio a Pasajeros) responsable de escoltar al menor sin acompañante hacia y desde el avión durante el proceso de abordaje y desembarque?", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El embarque de pasajeros se llevará a cabo por las puertas designadas:", "c": "Políticas y Procedimientos", "o": ["Puertas 1L y 1R", "Puertas 1L, de ser necesario 2R", "Puertas 1L, de ser necesario 2L"], "a": 2}, {"t": "El agente de tierra proporciona al JC/encargado de vuelo un sobre con toda la documentación del TWOV:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La prioridad de uso de los jumpseat de cabina de pasajero inicia con los tripulantes de cabina y pilotos asignados al vuelo, viajando en deadheading y colaboradores de la aerolínea en misión oficial que están cumpliendo con tareas laborales en tiempo de servicio:", "c": "Políticas y Procedimientos", "o": ["Cierto.", "Falso"], "a": 0}, {"t": "Los Tripulantes de Cabina, al finalizar la demostración y antes de dirigirse al Jumpseat, deben verificar las alas de ambos lados para verificar formación de escarcha, hielo o nieve:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En caso que el facultativo no cuente con su licencia o carnet de idoneidad el tripulante de cabina debe:", "c": "Políticas y Procedimientos", "o": ["Solicitar documento de identidad personal.", "Datos de la especialidad.", "Números de contacto.", "Todas son correctas."], "a": 3}, {"t": "Como política de la aerolínea, solamente se consume a bordo las bebidas alcohólicas que formen parte de la selección ofrecida como parte de nuestro servicio:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En cuanto a la asistencia a bordo, los tripulantes de cabina tienen la responsabilidad legal de asistir a los clientes con necesidades especiales:", "c": "Políticas y Procedimientos", "o": ["Durante la comida (abrir empaque e identificar las comidas).", "Asistir a clientes hacia y desde el baño si así lo necesita.", "Asistirlos cada treinta (30) minutos según la duración del vuelo;", "Garantizar la asistencia en las maniobras para el traslado de los pasajeros desde y hacia la silla de rueda a su asiento en el avión.", "Todas son correctas"], "a": 4}, {"t": "Los animales de servicio y apoyo emocional pueden viajar en cabina de clase ejecutiva y en cabina de clase económica sin restricción de día:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El JC/encargado de vuelo, en la eventualidad de uso del tercer juego de jumpseat, debe garantizar que los ocupantes sin asignación de puertas de responsabilidad sean instruidos en el rol de ABP, para lograr este objetivo:", "c": "Políticas y Procedimientos", "o": ["Se utilizará la Tarjeta de Seguridad Briefing Card para uso de un jumpseat de cabina de pasajeros y la tarjeta de seguridad y criterios.", "Se utilizará solamente la Tarjeta de Seguridad y Criterio.", "El Tripulante C, es el responsable de realizarle el briefing al ocupante."], "a": 0}, {"t": "La Bitácora de Cabina se utiliza para registrar discrepancias que afecten o no la aeronavegabilidad.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Debemos advertir a los clientes, sentados en ventana de emergencia, sobre la importancia de mantener el pasillo libre de artículos personales utilizando el espacio debajo del asiento de enfrente, durante despegue o aterrizaje.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Debemos advertir a los clientes asignados en ventana de emergencia que las ventanillas deben estar abiertas durante el despegue y aterrizaje.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Debemos indicarle durante el Briefing, a clientes sentados en ventana de emergencia, que procedan a abrir las ventanas cuando escuchen de la tripulación: “EASY VICTOR, EASY VICTOR”.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "El cliente sentado en la ventana de emergencia debe operar la salida cuando escuche por parte de la tripulación: EVACUACIÓN, EVACUACION”:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las ventanillas de las ventanas de emergencia deben permanecer abiertas durante:", "c": "Políticas y Procedimientos", "o": ["Rodaje, despegue y aterrizaje.", "Abastecimiento de combustible.", "Todas son correctas"], "a": 2}, {"t": "El JC debe asegurarse que las aeronaves que tenga el tercer juego de jump seat que los ocupantes sin asignación de puertas de responsabilidad sean instruidos en el rol de ABP.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Si un pasajero o miembro de la tripulación sufre quemaduras con batería de litio esta debe ser tratada como quemadura química:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Toda persona mayor a dos años debe ocupar un asiento con cinturón de seguridad.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El procedimiento de descontinuar un aterrizaje (Missed Approach) es una maniobra que realiza un piloto cuando una aproximación no tiene las condiciones para completarlo:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El área de Servicios a Pasajeros debe verificar en el mostrador que el POC corresponda a los permitidos, declaración del médico y baterías del POC.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Cuando se implementan restricciones de asientos, los clientes deben permanecer en el asiento asignado solamente para el despegue.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "En una operación irregular la mayor causa de disgusto de los clientes es:", "c": "Políticas y Procedimientos", "o": ["Al solicitar una bebida alcohólica y se le niegue.", "La falta de información.", "Que no se le permite bajar del avión.", "Que no se le permita utilizar su teléfono móvil."], "a": 1}, {"t": "Filas en donde no se deben utilizar POC:", "c": "Políticas y Procedimientos", "o": ["Filas de salida de emergencia.", "Fila 5 (donde está el mamparo en aviones matricula HP).", "Fila 1 de Clase Ejecutiva.", "Todas son correctas."], "a": 3}, {"t": "Todo cliente viajando con POC debe estar sentado en ventana, excepto si no requiere ni planea utilizar el POC durante carreteo, despegue o aterrizaje. Durante estas etapas el POC debe estar en un compartimento superior o armario de CE.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los anuncios en una operación irregular se deben iniciar ya sea por el capitán o JC/Encargado de vuelo a los 40 minutos luego de la hora programada de salida.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Según el procedimiento de Admisión a la cabina de mando, las luces que puedan interferir con la visión nocturna de la cabina de mando deben ser bajadas a tenue antes de entrar a la cabina", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Empleados del operador y/o explotador podrán ingresar a la Cabina de Mando, si la presencia en la cabina de pilotaje es necesaria y que han sido autorizados, según establecido en el RACP, Libro XIV Parte I, Articulo 562:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los Tripulantes de Cabina debemos operar o ajustar el puente de abordaje de escuchar la alarma automática del puente para evitar daños a la puerta del avión:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Debemos solicitar asistencia médica a bordo por medio de un anuncio utilizando los términos:", "c": "Políticas y Procedimientos", "o": ["Doctor Naturista, Odontólogo, Oncólogo.", "Facultativo, Galeno, Profesional de la salud", "Galeno, personal voluntario de la Cruz Roja, Asistente Dental", "Profesional de la salud, Licenciado en Registros Médicos, Galeno"], "a": 1}, {"t": "Debemos realizar reportes después de brindar asistencia médica abordo a través de:", "c": "Políticas y Procedimientos", "o": ["AIMS", "Copa Escucha", "Seguridad y Calidad (AQD)", "Todas son correctas"], "a": 2}, {"t": "La aerolínea brinda asistencia en el baño con la eliminación de desechos y requiere que los clientes con discapacidades se sienten sobre mantas.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Animal que ha sido entrenado para proveer asistencia o realizar una tarea a un individuo con discapacidad:", "c": "Políticas y Procedimientos", "o": ["Mascota", "Animal de servicio", "Animal de apoyo emocional", "Todas son correctas"], "a": 1}, {"t": "Animal necesario para el bienestar emocional del pasajero durante el vuelo y puede estar o no entrenado para ese rol.", "c": "Políticas y Procedimientos", "o": ["Mascota", "Animal de servicio", "Animal de soporte emocional", "Todas son correctas"], "a": 2}, {"t": "Código que aparece en el Final Report para identificar un animal de servicio:", "c": "Políticas y Procedimientos", "o": ["ESAN", "VANS", "PETC", "SVAN"], "a": 3}, {"t": "Código que aparece en el Final Report para identificar a un animal de soporte emocional:", "c": "Políticas y Procedimientos", "o": ["VANS", "ESAN", "SVAN", "PETC"], "a": 1}, {"t": "Los animales de servicio y apoyo emocional pueden viajar en las siguientes cabinas:", "c": "Políticas y Procedimientos", "o": ["Cabina de clase ejecutiva", "Cabina de clase económica", "Todas son correctas"], "a": 2}, {"t": "Clientes con animales de servicio pueden ser asignados a cualquier asiento del avión", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "¿Podemos aceptar cargadores para infantes sin espaldares o cargadores de cintura?", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "¿Las bebidas alcohólicas con menos del 70% de alcohol por volumen son mercancías peligrosas exceptuadas que se permiten a bordo del avión?", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El JC/encargado de vuelo y el Piloto al Mando deben ser notificados antes del abordaje que en su vuelo se encuentra un cliente con POC:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "De tener un cliente viajando con un POC usted lo ubicaría en:", "c": "Políticas y Procedimientos", "o": ["Filas con mamparo adelante (fila 5, 1 en clase ejecutiva)", "Ventanas de emergencia", "Todas son incorrectas"], "a": 2}, {"t": "Se permite el asiento de pasillo si el cliente no requiere ni planea utilizar el POC durante el taxeo, despegue o aterrizaje.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Al escuchar este Comando: ____________ los pasajeros sentados en ventanas de emergencia, deberán accionar rápidamente verificando condiciones exteriores y si las condiciones lo permiten proceder a abrir la salida respectiva:", "c": "Políticas y Procedimientos", "o": ["“EASY VICTOR, EASY VICTOR”", "“SUELTENSE LOS CINTURONES”", "“EVACUACIÓN, EVACUACIÓN”", "“SALGAN DEJEN TODO”"], "a": 2}, {"t": "La aerolínea puede negar el transporte a clientes con discapacidad sólo por las mismas razones por las cuales se niega a otros clientes.", "c": "Políticas y Procedimientos", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "El transporte de mascotas en cabina se ofrece de lunes a domingo en vuelos internacionales y domésticos.", "c": "Políticas y Procedimientos", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "Si el animal de servicio y apoyo emocional es demasiado grande para acomodarse a los pies del pasajero, el pasajero podrá comprar un asiento extra para tener espacio adicional y que el perro pueda acomodarse en el piso:", "c": "Políticas y Procedimientos", "o": ["Cierto.", "Falso."], "a": 0}, {"t": "El rechazo de transporte puede ocurrir a clientes con enfermedades contagiosas o infecciosas como está determinado por el ente regulador de la salud.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El transporte puede ser permitido si el cliente con una discapacidad producto de una enfermedad infecto contagiosa cuenta con un certificado médico que le permite realizar el vuelo, verificado por el Personal de Tierra:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Persona (s) con impedimento (s) mentales aceptados para su transportación (en la aerolínea o interlínea):", "c": "Políticas y Procedimientos", "o": ["Deberán ir con un acompañante.", "No deben sentarse en las filas de salida de emergencia.", "Debe ser asignado a un asiento de ventana y su acompañante en el asiento adyacente.", "Todas son correctas"], "a": 3}, {"t": "El agente de Servicio a Pasajeros debe informar al JC/Encargado de Vuelo que un cliente con impedimentos mentales y su acompañante serán abordados y proveerle la información sobre la ubicación de asientos.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El JC / Encargado de Vuelo debe informar al capitán y a los otros miembros de la tripulación y al personal de tierra a la llegada al destino que viene a bordo un cliente con impedimentos mentales.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los Agentes de servicio a pasajeros son los encargados de verificar la documentación requerida de las clientes en estado de gravidez.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Durante una evacuación de emergencia, el cinturón de seguridad debe permanecer abrochado en el cargador del infante y sólo el infante/niño es removido del avión.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Queda revocado el uso de los siguientes cargadores:", "c": "Políticas y Procedimientos", "o": ["Sin espaldares", "Cargadores de cintura.", "Chaleco tipo arnés.", "Todas son correctas"], "a": 3}, {"t": "El Sistema Cares está diseñado para trabajar en conjunto con el cinturón de seguridad de la aeronave brindándole a los jóvenes viajeros, entre las edades de 2 a 4 años, el mismo nivel de seguridad que los cargadores aprobados.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El sistema Cares al igual que los cargadores de infantes tiene las instrucciones impresas que indican como colocarlos en el asiento.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Procedimiento para el manejo del Menor Sin Acompañante:", "c": "Políticas y Procedimientos", "o": ["El agente de Servicio a pasajeros debe entregar el Formulario de Menor Sin Acompañante al TCP que recibe al menor al momento del abordaje, completado.", "El JC/Encargado de Vuelo se asegura que el formulario sea firmado por el agente encargado y le regrese la copia(s) que corresponda(n) al TCP.", "Los documentos de viaje del menor (pasaporte, boleto, pase de abordar) son colocados dentro del sobre por el agente de Servicio a Pasajeros, el cual debe ser revisado por el mismo, el JC/Encargado de Vuelo se asegura que los documentos se reciben al momento de abordar el avión.", "Los documentos deben ser custodiados en todo momento por personal de la aerolínea", "Todas son correctas."], "a": 4}, {"t": "Es responsabilidad del JC/Encargado de vuelo asegurarse que la instrucción verbal de seguridad individual se cumpla antes del embarque a los clientes adultos mayores:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Las leyes prohíben que la aerolínea pueda negar el abordaje de un cliente con discapacidad aun cuando afecte la seguridad del vuelo.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Excepción para Animales de servicio: se aceptará has dos (2) perros por pasajero, siempre y cuando demuestre en la documentación entregada a los Agentes de SAP que cada perro desempeña tareas diferentes o que, por la longitud del viaje, se turnan para dar la atención al pasajero.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Ningún piloto puede despegar o aterrizar un avión cuando cualquier comida, bebida, útiles de mesa, suministrados por el explotador, estén colocados en cualquier asiento de clientes.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Durante las demostraciones de seguridad previa al vuelo, Copa Airlines brindará información a los pasajeros de la importancia del uso de los cinturones de seguridad de manera visible siempre que la señal está activada.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Copa Airlines promueve que el uso del cinturón de seguridad sea realizado sobre las frazadas, abrigos u otras piezas personales.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Durante el período de cabina estéril, los tripulantes de cabina no entran ni llaman a la cabina de mando a menos que sea necesario para dar información referente a una situación de emergencia en la cual estén envueltas la seguridad de los pasajeros y la tripulación:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "CRM encierra un conjunto crítico de comportamientos humanos interpersonales observables quevan más allá de las habilidades técnicas y de maniobra. Su objetivo principal consiste en mejorar la experiencia técnica del miembro de la tripulación para desarrollar un entorno de tripulación más seguro y productivo.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "La Gestión de amenazas y errores (TEM) se refiere al proceso de gestión de amenazas operacionales y errores humanos. La gestión de amenazas reduce el potencial de error, mientras que la gestión de errores mitiga las consecuencias negativas de estos:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "TEM promueve una cultura de profesionalismo, centrada en la vigilancia en lugar de la complacencia, implementando un proceso activo y continuo de identificación y preparación para amenazas e identificación y reparación de errores lo antes posible:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En el modelo TEM, la contramedida Preparar nos permite:", "c": "Políticas y Procedimientos", "o": ["Reconocer y recuperar el error que se haya cometido.", "Anticiparnos y prepararnos contra las posibles amenazas.", "Recuperarnos del error y reparar la situación."], "a": 1}, {"t": "En el modelo TEM, la contramedida Reparar nos permite:", "c": "Políticas y Procedimientos", "o": ["Anticiparnos y recuperarnos contra las posibles amenazas.", "Identificar las herramientas a utilizar.", "Reconocer y reparar los errores que se logren detectar."], "a": 2}, {"t": "Las amenazas se definen como eventos que ocurren fuera de la influencia de la tripulación de vuelo, aumentan la complejidad operativa de un vuelo y requieren atención y gestión de la tripulación para mantener los márgenes de seguridad.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En la aviación comercial, las amenazas se pueden dividir en dos (2) categorías:", "c": "Políticas y Procedimientos", "o": ["Amenazas ambientales y amenazas de la aerolínea.", "Amenazas irreparable y amenazas empresariales.", "Amenazas distractoras y amenazas ambientales."], "a": 0}, {"t": "El primer paso en el manejo efectivo de amenazas es identificar amenazas. Cuanto antes se identifique una amenaza, más rápido y eficaz se puede gestionar, minimizando el impacto en operaciones seguras:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Los errores no intencionales se conocen como descuidos o errores honestos y se reconocen como parte de la naturaleza humana.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Cuanto antes se identifique un UAS, puede ocurrir una recuperación más temprana. Un avión que opera en un estado no deseado y no se recupera rápidamente puede provocar un incidente o accidente.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El objetivo de programa CRM /TEM se mantiene singularmente enfocado: maximizar la seguridad de vuelo minimizando los accidentes y accidentes causados por factores humanos.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Se mantiene una operación segura combinando habilidades técnicas con la gestión de amenazas y errores a través de la implementación efectiva de las habilidades de CRM y TEM.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Conciencia situacional / Situacional Awareness (SA) es un modelo mental que proporciona a la tripulación una comprensión de lo que sucede a su alrededor, entendiendo la importancia de lo que sucede a su alrededor y cómo se relaciona con lo que quiere conseguir.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "A niños menores de 11 años de edad o menores sin acompañante pueden viajar con una mascota en cabina.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Un pasajero podrá viajar con una mascota en cabina y un animal de servicio o apoyo emocional:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Se acepta el transporte de mascotas de menos de 12 semanas:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Si durante el briefing con SAP el Final Report no está listo e impreso, debemos solicitar al agente los detalles del vuelo y elaborar un reporte en AQD:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Para presentarle al pasajero el briefing card para mascotas en cabina, la tripulación cuenta con un script, el cual su objetivo es que la tripulación y el pasajero confirmen en conjunto los acuerdos de transporte desde el inicio del vuelo.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Por su naturaleza y característica, las Mercancías Peligrosas requieren de más precauciones en su aceptación y manejo que la carga en general.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El empaque o embalaje de los productos es esencial en la reglamentación del transporte de mercancías peligrosas por vía aérea, por ello se establecen instrucciones precisas para el embalaje de todas las mercancías peligrosas aceptables.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Todas las mercancías peligrosas son sencillas de identificar, aunque algunos artículos aparentemente comunes puedan contener elementos riesgosos para el transporte aéreo.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "Si detectamos mercancías peligrosas no aprobadas para viajar como equipaje de mano en cabina de pasajeros, la acción inmediata es reportar la situación al JC/Encargado de vuelo y el Capitán de tal manera se tomen las acciones con conjunto con los agentes de SAP.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Cuál es el objetivo principal del CRM?", "c": "Políticas y Procedimientos", "o": ["Cambiar los procedimientos establecidos", "Mejorar la experiencia técnica del miembro de la tripulación para desarrollar un entorno de tripulación más seguro y productivo.", "Aumentar las ganancias de Copa Airlines"], "a": 1}, {"t": "El CRM se refiere al uso efectivo de:", "c": "Políticas y Procedimientos", "o": ["Recursos humanos.", "Equipos.", "Herramientas e información", "Todas son correctas."], "a": 3}, {"t": "El trabajo en equipo a bordo del avión es crítico. Sin él, ningún entrenamiento de liderazgo produce un ambiente seguro a bordo", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Pueden producirse errores cuando no se identifica una amenaza, o se identifica, pero no se gestiona de manera efectiva:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "TEM (Threat and Error Management por sus siglas en inglés) se refiere al proceso de gestión de amenazas operacionales y errores humanos.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "El modelo TEM enfatiza en tres conceptos básicos:", "c": "Políticas y Procedimientos", "o": ["Preparar, Reparar y recuperar.", "Preparar, salir y alejarse", "Comunicar, conciliar y comprometerse"], "a": 0}, {"t": "Los errores intencionales, están relacionados con un deseo consciente y la acción del miembro de la tripulación para desviarse de los procedimientos preestablecidos, a fin de obtener una ventaja o beneficio:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Puede ocurrir un UAS si no se identifica un error o no se repara adecuadamente.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "¿Son factores que contribuyen a mejorar nuestra SA?", "c": "Políticas y Procedimientos", "o": ["Una buena sesión informativa (briefing)", "Promover en la tripulación de cabina, que hablen cuando vean un problema.", "La perspectiva de cada uno de los miembros de la tripulación es importante.", "Todas las anteriores"], "a": 3}, {"t": "Los errores se clasifican como:", "c": "Políticas y Procedimientos", "o": ["Intencionales", "No intencionales o intencionales", "No Intencionales.", "Ninguna de las anteriores"], "a": 1}, {"t": "En la aviación comercial, las amenazas se pueden dividir en:", "c": "Políticas y Procedimientos", "o": ["Amenazas ambientales, que están fuera del control directo de la aerolínea, como el clima y el ATC.", "Amenazas de la aerolínea, que se originan dentro de las operaciones de vuelo, como el mal funcionamiento del sistema y los problemas en tierra", "Todas son correctas"], "a": 2}, {"t": "Las Mercancías peligrosas son artículos o sustancias que son capaces de poner en riesgo la salud, la seguridad, la propiedad o el medio ambiente, y que se clasifican de acuerdo con la Sección 3 del Manual de Reglamentación sobre Mercancías Peligrosas de IATA:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las baterías de litio, hielo seco, aerosoles, pueden no parecer peligrosos, sin embargo, cuando se transportan en un avión pueden serlo:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Las Regulaciones IATA/OACI y el Libro XVII de la Aeronáutica Civil de Panamá (RACP), son la fuente básica de información para el personal de Copa Airlines:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Bajo qué entidades se basa el transporte con seguridad de Mercancías Peligrosas:", "c": "Políticas y Procedimientos", "o": ["OEA", "OACI, IATA y AAC", "FAA", "TSA"], "a": 1}, {"t": "Antes de la salida del vuelo, el Capitán es notificado de mercancías peligrosas llevadas como carga por parte del personal de rampa, a través del documento denominado NOTOC.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "Usando como referencia la Tabla 2.3.A, las armas de electrochoque (Taser) son permitidas dentro del equipaje de mano.", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 1}, {"t": "El término \"COMAT\" en aviación se utiliza para describir cualquier equipo, pieza de repuesto, herramienta o material que pertenece y es gestionado por una aerolínea o compañía de aviación para el mantenimiento y operación de sus aeronaves:", "c": "Políticas y Procedimientos", "o": ["Cierto", "Falso"], "a": 0}, {"t": "En el momento en que sea necesario colillar / enviar equipajes o artículos personales a las bodegas de la aeronave por falta de espacios en los compartimentos superiores durante el abordaje, es responsabilidad de todos los tripulantes garantizar que el pasajero responda las siguientes preguntas:", "c": "Políticas y Procedimientos", "o": ["¿Tiene artículos de valor dentro?, ¿Tiene algún medicamento que necesite tomar durante el vuelo? (para evitar posibles emergencias médicas)", "¿Tiene baterías o dispositivos electrónicos operados por baterías dentro?", "Si la respuesta a alguna de las preguntas es afirmativa, garantice que los artículos sean sacados del equipaje / artículo personal antes que sea retirado de la aeronave. Informe al JC/Encargado de vuelo y el Agentes de SAP.", "Todas son correctas"], "a": 3}, {"t": "¿A qué clase pertenecen los gases?", "c": "Políticas y Procedimientos", "o": ["Clase 7", "Clase 2", "Clase 4", "Clase 3"], "a": 1}, {"t": "¿A qué clase pertenecen los explosivos?", "c": "Políticas y Procedimientos", "o": ["Clase 3", "Clase 9", "Clase 1", "Clase 4"], "a": 2}, {"t": "¿A qué clase pertenecen los líquidos inflamables?", "c": "Políticas y Procedimientos", "o": ["Clase 3", "Clase 6", "Clase 9", "Clase 1"], "a": 0}, {"t": "¿A qué clase pertenecen las Sustancias Oxidantes?", "c": "Políticas y Procedimientos", "o": ["Clase 8", "Clase 4", "Clase 5", "Clase 6"], "a": 2}, {"t": "¿A qué tipo de productos corresponde la clase 6?", "c": "Políticas y Procedimientos", "o": ["Gases", "Sustancias tóxicas", "Corrosivos", "Sólidos inflamables"], "a": 1}, {"t": "¿A qué tipo de productos corresponde la clase 4?", "c": "Políticas y Procedimientos", "o": ["Radioactivos", "Corrosivos", "Sólidos inflamables", "Líquidos inflamables o vapores tóxicos"], "a" const LS_WRONG = 'copaQuizWrongV1';
const $ = s => document.querySelector(s);
const app = $('#app');
const getWrong = () => { try { return JSON.parse(localStorage.getItem(LS_WRONG) || '[]'); } catch(e){ return []; } };
const setWrong = a => { try { localStorage.setItem(LS_WRONG, JSON.stringify(a)); } catch(e){} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const cats = [...new Set(QUESTIONS.map(q=>q.c))].sort();
const catCount = c => QUESTIONS.filter(q=>q.c===c).length;

let S = null; // estado de sesión

function home(){
  const wrong = getWrong();
  app.innerHTML = `
  <div class="hero"><div class="plane">✈️</div>
    <h1>Quiz Copa</h1><p>Examen anual · ${QUESTIONS.length} preguntas · 10 categorías</p></div>
  <div class="card"><h2>1 · Elige categorías</h2>
    <div class="chips" id="chips">
      <div class="chip on" data-c="__all">Todas<small>${QUESTIONS.length}</small></div>
      ${cats.map(c=>`<div class="chip" data-c="${esc(c)}">${esc(c)}<small>${catCount(c)}</small></div>`).join('')}
    </div></div>
  <div class="card"><h2>2 · Cantidad de preguntas</h2>
    <div class="row" id="counts">
      ${[10,20,30,50].map((n,i)=>`<div class="seg${i===1?' on':''}" data-n="${n}">${n}</div>`).join('')}
      <div class="seg" data-n="all">Todas</div>
    </div></div>
  <div class="card"><h2>3 · Modo</h2>
    <div class="mode" id="modes">
      <div class="seg on" data-m="practice">📝 Práctica<small style="display:block;font-weight:400">ves la respuesta al instante</small></div>
      <div class="seg" data-m="exam">⏱️ Examen<small style="display:block;font-weight:400">resultado al final</small></div>
    </div>
    ${wrong.length?`<button class="btn ghost" id="btnWrong">🔁 Practicar mis falladas (${wrong.length})</button>`:''}
    <button class="btn primary" id="btnStart">Comenzar →</button>
  </div>
  <div class="foot">Banco QFStudio · Manual de Tripulación de Cabina</div>`;

  const chipBox = $('#chips');
  chipBox.addEventListener('click', e=>{
    const ch = e.target.closest('.chip'); if(!ch) return;
    if(ch.dataset.c==='__all'){ chipBox.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); ch.classList.add('on'); }
    else { chipBox.querySelector('[data-c="__all"]').classList.remove('on'); ch.classList.toggle('on');
      if(!chipBox.querySelectorAll('.chip.on').length) chipBox.querySelector('[data-c="__all"]').classList.add('on'); }
  });
  $('#counts').addEventListener('click', e=>{ const s=e.target.closest('.seg'); if(!s)return;
    $('#counts').querySelectorAll('.seg').forEach(x=>x.classList.remove('on')); s.classList.add('on'); });
  $('#modes').addEventListener('click', e=>{ const s=e.target.closest('.seg'); if(!s)return;
    $('#modes').querySelectorAll('.seg').forEach(x=>x.classList.remove('on')); s.classList.add('on'); });
  const bw = $('#btnWrong'); if(bw) bw.addEventListener('click', ()=> start({onlyWrong:true}));
  $('#btnStart').addEventListener('click', ()=> start({}));
}

function start({onlyWrong}){
  let pool;
  if(onlyWrong){ const w = new Set(getWrong()); pool = QUESTIONS.map((q,i)=>({...q, qi:i})).filter(q=>w.has(q.qi)); }
  else{
    const on = [...document.querySelectorAll('#chips .chip.on')].map(x=>x.dataset.c);
    const useAll = on.includes('__all');
    pool = QUESTIONS.map((q,i)=>({...q, qi:i})).filter(q=> useAll || on.includes(q.c));
  }
  if(!pool.length){ alert('No hay preguntas para esa selección.'); return; }
  const nSel = document.querySelector('#counts .seg.on').dataset.n;
  const mode = document.querySelector('#modes .seg.on').dataset.m;
  pool = shuffle(pool);
  if(nSel!=='all') pool = pool.slice(0, Math.min(+nSel, pool.length));
  S = { list: pool, i:0, score:0, mode, wrong: [], picks: [] };
  renderQ();
}

function renderQ(){
  const q = S.list[S.i], n = S.list.length;
  const order = shuffle(q.o.map((_,i)=>i));
  app.innerHTML = `
  <div class="card">
    <div class="qhead"><span class="qnum">Pregunta ${S.i+1} de ${n}</span><span class="qcat">${esc(q.c)}</span></div>
    <div class="bar"><i style="width:${(S.i/n)*100}%"></i></div>
    <div class="qtext">${esc(q.t)}</div>
    <div id="opts">${order.map(oi=>`<button class="opt" data-oi="${oi}">${esc(q.o[oi])}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <button class="btn primary" id="btnNext" style="display:none">${S.i+1===n?'Ver resultado →':'Siguiente →'}</button>
  </div>`;
  $('#opts').addEventListener('click', e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    answer(+b.dataset.oi, order);
  });
  $('#btnNext').addEventListener('click', ()=>{
    S.i++;
    if(S.i < S.list.length) renderQ(); else results();
  });
}

function answer(oi, order){
  const q = S.list[S.i];
  const ok = oi === q.a;
  S.picks.push({qi:q.qi, pick:oi, ok});
  if(ok) S.score++;
  else { S.wrong.push({qi:q.qi, pick:oi}); }
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b=>{ b.disabled = true; const bOi = +b.dataset.oi;
    if(bOi===q.a) b.classList.add('correct');
    else if(bOi===oi) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(S.mode==='practice'){
    const fb = $('#fb');
    fb.className = 'feedback ' + (ok?'ok':'no');
    fb.textContent = ok ? '✅ ¡Correcto!' : '❌ Incorrecto. La respuesta correcta está marcada en verde.';
  }
  $('#btnNext').style.display = 'block';
  document.querySelector('.bar i').style.width = ((S.i+1)/S.list.length)*100 + '%';
  window.scrollTo({top:0, behavior:'smooth'});
}

function results(){
  const n = S.list.length, pct = Math.round(S.score/n*100);
  const wset = new Set(getWrong());
  S.wrong.forEach(w=>wset.add(w.qi));
  S.picks.forEach(p=>{ if(p.ok) wset.delete(p.qi); });
  setWrong([...wset]);
  const msg = pct>=90 ? '🌟 ¡Lista para el examen!' : pct>=70 ? '💪 Vas muy bien, sigue practicando' : '📚 A repasar esas falladas';
  const C = 2*Math.PI*64;
  app.innerHTML = `
  <div class="card"><div class="score-wrap">
    <svg class="ring" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="64" fill="none" stroke="#e8eef6" stroke-width="14"/>
      <circle cx="75" cy="75" r="64" fill="none" stroke="${pct>=70?'#16a34a':pct>=40?'#f59e0b':'#dc2626'}"
        stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"
        transform="rotate(-90 75 75)"/>
      <text x="75" y="82" text-anchor="middle" font-size="30" font-weight="800" fill="#12233d">${pct}%</text>
    </svg>
    <div class="big">${S.score} / ${n}</div>
    <p class="sub">${msg}</p>
    <div class="stat-row">
      <div class="stat"><b style="color:#16a34a">${S.score}</b><span>correctas</span></div>
      <div class="stat"><b style="color:#dc2626">${S.wrong.length}</b><span>falladas</span></div>
    </div>
    ${S.wrong.length?`<button class="btn primary" id="btnRetry">🔁 Reintentar falladas (${S.wrong.length})</button>`:''}
    <button class="btn ghost" id="btnHome">🏠 Nuevo quiz</button>
    ${S.wrong.length?`<div class="miss"><h3>Repaso de falladas</h3>${S.wrong.map(w=>{
      const q = QUESTIONS[w.qi];
      return `<div class="miss-item"><div class="mq">${esc(q.c)} · ${esc(q.t)}</div>
        <div class="mu">Tu respuesta: ${esc(q.o[w.pick])}</div>
        <div class="ma">Correcta: ${esc(q.o[q.a])}</div></div>`;
    }).join('')}</div>`:''}
  </div></div>`;
  const br = $('#btnRetry');
  if(br) br.addEventListener('click', ()=>{
    S = { list: shuffle(S.wrong.map(w=>({...QUESTIONS[w.qi], qi:w.qi}))), i:0, score:0, mode:S.mode, wrong:[], picks:[] };
    renderQ();
  });
  $('#btnHome').addEventListener('click', home);
  window.scrollTo({top:0});
}

home();
</script>
</body>
</html>
